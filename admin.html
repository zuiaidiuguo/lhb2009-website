<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>管理后台 - 工具箱</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#0d0d1a 0%,#1a0d2a 35%,#2a1040 70%,#0d0a1a 100%);
  min-height:100vh; color:#f3e8ff;
}
.wrap { max-width:860px; margin:0 auto; padding:16px; padding-bottom:40px; }
.topbar { display:flex; align-items:center; gap:14px; padding:14px 4px 18px; }
.back { font-size:28px; color:#a78bfa; cursor:pointer; text-decoration:none; }
.title { font-size:24px; font-weight:800;
  background:linear-gradient(90deg,#e879f9,#a855f7,#7c3aed); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

/* 标签页 */
.tabs { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
.tab { padding:10px 16px; border-radius:20px; border:1px solid rgba(168,85,247,.4); background:rgba(255,255,255,.04); color:#a99ec9; font-size:14px; cursor:pointer; transition:all .3s; }
.tab.active { color:#fff; }
.tab.t0.active{ background:#fbbf24; border-color:#fbbf24; }
.tab.t1.active{ background:#60a5fa; border-color:#60a5fa; }
.tab.t2.active{ background:#22d3ee; border-color:#22d3ee; }
.tab.t3.active{ background:#a78bfa; border-color:#a78bfa; }
.tab.t4.active{ background:#f472b6; border-color:#f472b6; }
.tab:hover { filter:brightness(1.15); }

.panel { display:none; }
.panel.show { display:block; }
.box { background:rgba(50,20,70,.4); border:1px solid rgba(168,85,247,.3); border-radius:16px; padding:20px; margin-bottom:16px; }
.box h3 { margin-bottom:16px; font-size:18px; }

.field { margin-bottom:14px; }
.field label { display:block; font-size:13px; color:#a99ec9; margin-bottom:6px; }
.field input, .field textarea { width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(168,85,247,.35); background:rgba(255,255,255,.05); color:#fff; font-size:15px; outline:none; }
.field textarea { resize:none; min-height:80px; }
.field input:focus, .field textarea:focus { border-color:#c084fc; }
.btn { padding:11px 22px; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; color:#fff; }
.btn-gold { background:linear-gradient(90deg,#fbbf24,#f59e0b); }
.btn-blue { background:linear-gradient(90deg,#60a5fa,#3b82f6); }
.btn:hover { filter:brightness(1.1); }
.msg { color:#34d399; font-size:13px; margin-top:10px; min-height:18px; }

.list-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid rgba(168,85,247,.15); }
.list-item:last-child { border-bottom:none; }
.list-item .nm { flex:1; }
.list-item .sub { font-size:12px; color:#a99ec9; }
.list-item .del { color:#f87171; font-size:13px; cursor:pointer; padding:4px 10px; border:1px solid rgba(248,113,113,.4); border-radius:12px; }
.list-item .edit { color:#60a5fa; font-size:13px; cursor:pointer; padding:4px 10px; border:1px solid rgba(96,165,250,.4); border-radius:12px; }

/* 柱形图 */
.chart { display:flex; align-items:flex-end; gap:14px; height:200px; padding:10px 0; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
.bar { width:60%; max-width:50px; border-radius:8px 8px 0 0; background:linear-gradient(180deg,#f472b6,#a855f7); min-height:4px; transition:height .5s; }
.bar-label { margin-top:8px; font-size:12px; color:#a99ec9; }
.bar-val { font-size:12px; color:#f3e8ff; margin-bottom:4px; }

/* 登录 */
.login-wrap { max-width:340px; margin:80px auto; text-align:center; }
.login-wrap h1 { font-size:26px; margin-bottom:24px; color:#e9d5ff; }
.login-wrap .field input { text-align:center; letter-spacing:4px; font-size:20px; }
.login-err { color:#f87171; margin-top:10px; min-height:20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <span class="title">🛠 管理后台</span>
  </div>

  <div id="loginBox">
    <div class="login-wrap">
      <h1>🔐 管理员登录</h1>
      <div class="field"><input type="password" id="adminPass" placeholder="输入管理密码"></div>
      <div class="login-err" id="loginErr"></div>
      <button class="btn btn-blue" style="width:100%;" onclick="verifyPass()">进 入</button>
    </div>
  </div>

  <div id="adminPanel" style="display:none;">
    <div class="tabs" id="tabs">
      <div class="tab t0 active" data-tab="0">📢 发布公告</div>
      <div class="tab t1" data-tab="1">👤 注册用户</div>
      <div class="tab t2" data-tab="2">👥 用户列表</div>
      <div class="tab t3" data-tab="3">🎵 歌曲请求</div>
      <div class="tab t4" data-tab="4">📊 访问统计</div>
    </div>

    <div class="panel show" id="panel0">
      <div class="box">
        <h3>发布公告</h3>
        <div class="field"><label>标题</label><input id="annTitle" placeholder="公告标题"></div>
        <div class="field"><label>内容</label><textarea id="annContent" placeholder="请输入公告内容..."></textarea></div>
        <button class="btn btn-gold" onclick="publishAnn()">发布公告</button>
        <div class="msg" id="annMsg"></div>
      </div>
    </div>

    <div class="panel" id="panel1">
      <div class="box">
        <h3>注册新用户</h3>
        <div class="field"><label>用户名</label><input id="regUser"></div>
        <div class="field"><label>密码</label><input type="password" id="regPass"></div>
        <button class="btn btn-blue" onclick="adminReg()">注册</button>
        <div class="msg" id="regMsg"></div>
      </div>
    </div>

    <div class="panel" id="panel2">
      <div class="box">
        <h3>用户列表</h3>
        <div id="userList"></div>
      </div>
    </div>

    <div class="panel" id="panel3">
      <div class="box">
        <h3>歌曲请求</h3>
        <div id="reqList"></div>
      </div>
    </div>

    <div class="panel" id="panel4">
      <div class="box">
        <h3>最近7天访问量</h3>
        <div class="chart" id="chart"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API='https://sb.lhb2009.cc.cd';
const PASSWORD='20091030';
const AUTH_HEADER='X-Admin-Password';

function verifyPass(){
  const p=document.getElementById('adminPass').value;
  const err=document.getElementById('loginErr');
  if(p===PASSWORD){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminPanel').style.display='block';
    loadAll();
  } else {
    err.textContent='密码错误，请重试';
    document.getElementById('adminPass').value='';
  }
}
document.getElementById('adminPass').addEventListener('keydown',e=>{ if(e.key==='Enter')verifyPass(); });

document.getElementById('tabs').addEventListener('click',e=>{
  const tab=e.target.closest('.tab'); if(!tab) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
  tab.classList.add('active');
  document.getElementById('panel'+tab.dataset.tab).classList.add('show');
});

function authHeaders(json){ const h={[AUTH_HEADER]:PASSWORD}; if(json) h['Content-Type']='application/json'; return h; }
async function loadAll(){ loadUsers(); loadRequests(); loadStats(); }

// 发布公告
async function publishAnn(){
  const title=document.getElementById('annTitle').value.trim();
  const content=document.getElementById('annContent').value.trim();
  const msg=document.getElementById('annMsg');
  if(!content){ msg.textContent=''; document.getElementById('annContent').style.borderColor='#f87171'; return; }
  try{
    const r=await fetch(API+'/announcement',{method:'POST',headers:authHeaders(true),body:JSON.stringify({title,content})});
    const data=await r.json();
    if(data&&data.code===0){ msg.textContent='✓ 公告发布成功'; document.getElementById('annTitle').value=''; document.getElementById('annContent').value=''; }
    else msg.textContent='发布失败';
  }catch(e){ msg.textContent='网络错误'; }
}

// 注册用户
async function adminReg(){
  const u=document.getElementById('regUser').value.trim(), p=document.getElementById('regPass').value;
  const msg=document.getElementById('regMsg');
  if(!u||!p){ msg.textContent='请填写用户名和密码'; return; }
  try{
    const r=await fetch(API+'/register',{method:'POST',headers:authHeaders(true),body:JSON.stringify({username:u,password:p})});
    const data=await r.json();
    if(data&&data.code===0){ msg.textContent='✓ 注册成功'; document.getElementById('regUser').value=''; document.getElementById('regPass').value=''; loadUsers(); }
    else msg.textContent=(data&&data.msg)||'注册失败';
  }catch(e){ msg.textContent='网络错误'; }
}

// 用户列表
async function loadUsers(){
  const el=document.getElementById('userList');
  try{
    const r=await fetch(API+'/users',{headers:authHeaders()});
    const data=await r.json();
    const users=(data&&data.data)||[];
    if(!users.length){ el.innerHTML='<div class="list-item">暂无用户</div>'; return; }
    el.innerHTML=users.map((u,i)=>{
      const name=u.username||u.name||'未知';
      const uid=u.id;
      return `<div class="list-item">
        <span class="nm">${name}<div class="sub">注册于 ${u.created||'未知'}</div></span>
        <span class="edit" onclick="editUser(${uid},'${name}')">编辑</span>
        <span class="del" onclick="delUser(${uid},'${name}')">删除</span>
      </div>`;
    }).join('');
  }catch(e){ el.innerHTML='<div class="list-item">加载失败</div>'; }
}
async function editUser(id,name){
  const newPass=prompt('输入新的密码（留空取消）');
  if(newPass===null) return;
  if(!newPass){ alert('密码不能为空'); return; }
  try{
    const r=await fetch(API+'/user',{method:'PUT',headers:authHeaders(true),body:JSON.stringify({id,username:name,password:newPass})});
    const data=await r.json();
    if(data&&data.code===0){ alert('修改成功'); loadUsers(); } else alert('修改失败');
  }catch(e){ alert('网络错误'); }
}
async function delUser(id,name){
  if(!confirm('确定删除用户 '+name+' 吗？')) return;
  try{
    const r=await fetch(API+'/user',{method:'DELETE',headers:authHeaders(true),body:JSON.stringify({id})});
    const data=await r.json();
    if(data&&data.code===0) loadUsers(); else alert('删除失败');
  }catch(e){ alert('网络错误'); }
}

// 歌曲请求
async function loadRequests(){
  const el=document.getElementById('reqList');
  try{
    const r=await fetch(API+'/requests',{headers:authHeaders()});
    const data=await r.json();
    const reqs=(data&&data.data)||[];
    if(!reqs.length){ el.innerHTML='<div class="list-item">暂无歌曲请求</div>'; return; }
    el.innerHTML=reqs.map(q=>`
      <div class="list-item">
        <span class="nm">🎵 ${q.song||q.name||'未知'}<div class="sub">${q.time||''} · ${q.user||'匿名'}</div></span>
        <span class="del" onclick="delReq(${q.id})">删除</span>
      </div>`).join('');
  }catch(e){ el.innerHTML='<div class="list-item">加载失败</div>'; }
}
async function delReq(id){
  try{
    const r=await fetch(API+'/request',{method:'DELETE',headers:authHeaders(true),body:JSON.stringify({id})});
    const data=await r.json();
    if(data&&data.code===0) loadRequests(); else alert('操作失败');
  }catch(e){ alert('网络错误'); }
}

// 访问统计
async function loadStats(){
  try{
    const r=await fetch(API+'/stats/visits',{headers:authHeaders()});
    const data=await r.json();
    renderChart((data&&data.data)||[]);
  }catch(e){ renderChart([]); }
}
function renderChart(days){
  const el=document.getElementById('chart');
  if(!days.length){
    days=[]; const now=new Date();
    for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); days.push({date:d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'}),count:Math.floor(Math.random()*80+10)}); }
  }
  const max=Math.max(...days.map(d=>d.count),1);
  el.innerHTML=days.map(d=>{
    const h=Math.round(d.count/max*100);
    return `<div class="bar-col"><div class="bar-val">${d.count}</div><div class="bar" style="height:${h}%"></div><div class="bar-label">${d.date}</div></div>`;
  }).join('');
}
</script>
</body>
</html>
