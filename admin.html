<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>管理后台 - 工具箱</title>
<style>
:root{
  --bg1:#f0f4ff; --bg2:#e8f0fe; --bg3:#f5f0ff;
  --card:#ffffff;
  --primary:#4f7cff;
  --purple:#a855f7; --pink:#f472b6; --cyan:#06b6d4; --orange:#fb923c;
  --text:#1a1a2e; --text2:#4a4a6a;
  --border:#e8ecf4;
  --shadow:0 8px 24px rgba(79,124,255,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{scrollbar-width:thin;scrollbar-color:var(--primary) var(--border);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg2);border-radius:8px;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--primary),var(--purple));border-radius:8px;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
  min-height:100vh; color:var(--text);
  animation:fadeUp .4s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:860px;margin:0 auto;padding:16px;padding-bottom:40px;}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 4px 18px;}
.back{font-size:30px;color:var(--primary);cursor:pointer;text-decoration:none;font-weight:700;}
.title{font-size:24px;font-weight:800;flex:1;
  background:linear-gradient(90deg,var(--primary),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logout-btn{padding:8px 16px;border:none;border-radius:20px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  background:linear-gradient(90deg,#fb7185,#f43f5e);box-shadow:0 4px 12px rgba(244,63,94,.3);
  transition:transform .15s ease;}
.logout-btn:active{transform:scale(.96);}

/* 标签页 */
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab{padding:10px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:14px;cursor:pointer;box-shadow:var(--shadow);transition:all .25s;}
.tab.active{color:#fff;border-color:transparent;}
.tab.t0.active{background:linear-gradient(90deg,var(--orange),#f59e0b);}
.tab.t1.active{background:linear-gradient(90deg,var(--primary),#6a96ff);}
.tab.t2.active{background:linear-gradient(90deg,var(--cyan),var(--primary));}
.tab.t3.active{background:linear-gradient(90deg,var(--purple),var(--pink));}
.tab.t4.active{background:linear-gradient(90deg,var(--pink),var(--purple));}
.tab:hover{transform:translateY(-2px);}

.panel{display:none;}
.panel.show{display:block;}
.box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
.box h3{margin-bottom:16px;font-size:18px;color:var(--text);}
.box-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.box-head h3{margin-bottom:0;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;}
.field input,.field textarea{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:#f7f9ff;color:var(--text);font-size:15px;outline:none;transition:border-color .2s;}
.field textarea{resize:none;min-height:80px;}
.field input:focus,.field textarea:focus{border-color:var(--primary);}
.btn{padding:11px 22px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;transition:transform .15s ease;}
.btn:active{transform:scale(.96);}
.btn-gold{background:linear-gradient(90deg,var(--orange),#f59e0b);box-shadow:0 4px 12px rgba(251,146,60,.3);}
.btn-blue{background:linear-gradient(90deg,var(--primary),#6a96ff);box-shadow:0 4px 12px rgba(79,124,255,.3);}
.btn-red{background:linear-gradient(90deg,#fb7185,#f43f5e);box-shadow:0 4px 12px rgba(244,63,94,.3);}
.msg{color:#10b981;font-size:13px;margin-top:10px;min-height:18px;}
.msg.err{color:#f43f5e;}

.hist-item{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.hist-item:last-child{border-bottom:none;}
.hist-item .content{flex:1;font-size:15px;color:var(--text);}
.hist-item .time{font-size:12px;color:var(--text2);margin-top:4px;}
.hist-item .del{color:#f43f5e;font-size:13px;cursor:pointer;padding:4px 12px;border:1px solid var(--pink);border-radius:12px;background:#fff;transition:all .2s;white-space:nowrap;}
.hist-item .del:hover{background:linear-gradient(90deg,#fb7185,#f43f5e);color:#fff;}

.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.list-item .nm{flex:1;}
.list-item .sub{font-size:12px;color:var(--text2);}
.list-item .del{color:#f43f5e;font-size:13px;cursor:pointer;padding:4px 10px;border:1px solid var(--pink);border-radius:12px;background:#fff;transition:all .2s;}
.list-item .del:hover{background:linear-gradient(90deg,#fb7185,#f43f5e);color:#fff;}
.list-item .edit{color:var(--primary);font-size:13px;cursor:pointer;padding:4px 10px;border:1px solid var(--primary);border-radius:12px;background:#fff;transition:all .2s;}
.list-item .edit:hover{background:linear-gradient(90deg,var(--primary),#6a96ff);color:#fff;}

/* 登录 */
.login-wrap{max-width:340px;margin:40px auto;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:30px 28px;box-shadow:0 20px 50px rgba(79,124,255,.2);}
.login-wrap h1{font-size:22px;margin-bottom:18px;color:var(--text);
  background:linear-gradient(90deg,var(--primary),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.login-err{color:#f43f5e;margin-top:10px;min-height:20px;font-size:13px;}
.login-tip{margin-top:16px;font-size:13px;color:var(--text2);}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(30,40,80,.4);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:999;}
.modal-mask.show{display:flex;}
.modal-box{width:90%;max-width:340px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px 22px;position:relative;
  box-shadow:0 20px 50px rgba(79,124,255,.25);animation:modalIn .25s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.modal-out{animation:modalOut .2s ease forwards;}
@keyframes modalOut{from{opacity:1;transform:scale(1);}to{opacity:0;transform:scale(.92);}}
.modal-box h3{text-align:center;margin-bottom:18px;font-size:20px;color:var(--text);}
.close-x{position:absolute;top:10px;right:14px;font-size:22px;color:var(--text2);cursor:pointer;background:none;border:none;}
.close-x:hover{color:var(--purple);}
.modal-btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;color:#fff;
  background:linear-gradient(90deg,var(--primary),var(--purple));box-shadow:0 6px 16px rgba(79,124,255,.3);
  transition:transform .15s ease;}
.modal-btn:active{transform:scale(.96);}
.modal-btn.danger{background:linear-gradient(90deg,#fb7185,#f43f5e);box-shadow:0 6px 16px rgba(244,63,94,.3);}
.modal-text{text-align:center;color:var(--text2);font-size:15px;margin-bottom:18px;line-height:1.6;}
.modal-err{color:#f43f5e;font-size:13px;text-align:center;min-height:18px;margin-bottom:6px;}

/* 轻提示 */
.toast{position:fixed;left:50%;top:15%;transform:translateX(-50%) translateY(-10px);background:var(--card);color:var(--text);
  padding:12px 22px;border-radius:12px;box-shadow:0 10px 30px rgba(79,124,255,.3);font-size:15px;font-weight:600;z-index:2000;opacity:0;
  border:1px solid var(--border);transition:opacity .3s ease,transform .3s ease;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <span class="title">🛠 管理后台</span>
    <button class="logout-btn" id="logoutBtn" onclick="doLogout()" style="display:none;">退出登录</button>
  </div>

  <div id="loginBox">
    <div class="login-wrap">
      <h1>🔐 管理员登录</h1>
      <!-- 管理员登录 -->
      <div id="adminLogin">
        <div class="field"><label>管理密码</label><input type="password" id="adminPass" placeholder="输入管理密码"></div>
        <div class="login-err" id="adminLoginErr"></div>
        <button class="btn btn-blue" style="width:100%;" onclick="verifyPass()">进 入</button>
      </div>
    </div>
  </div>

  <div id="adminPanel" style="display:none;">
    <div class="tabs" id="tabs">
      <div class="tab t0 active" data-tab="0">📢 发布公告</div>
      <div class="tab t1" data-tab="1">📜 公告历史</div>
      <div class="tab t2" data-tab="2">👤 注册用户</div>
      <div class="tab t3" data-tab="3">👥 用户列表</div>
      <div class="tab t4" data-tab="4">🎵 歌曲请求</div>
    </div>

    <div class="panel show" id="panel0">
      <div class="box">
        <h3>发布公告</h3>
        <div class="field"><label>内容</label><textarea id="annContent" placeholder="请输入公告内容..."></textarea></div>
        <button class="btn btn-gold" onclick="publishAnn()">发布公告</button>
        <div class="msg" id="annMsg"></div>
      </div>
    </div>

    <div class="panel" id="panel1">
      <div class="box">
        <div class="box-head">
          <h3>公告历史</h3>
          <button class="btn btn-red" onclick="showClearConfirm()" style="padding:8px 16px;font-size:13px;">🗑 清空所有公告</button>
        </div>
        <div id="annHist"></div>
      </div>
    </div>

    <div class="panel" id="panel2">
      <div class="box">
        <h3>注册新用户</h3>
        <div class="field"><label>用户名</label><input id="regUser"></div>
        <div class="field"><label>密码</label><input type="password" id="regPass"></div>
        <button class="btn btn-blue" onclick="adminReg()">注册</button>
        <div class="msg" id="regMsg"></div>
      </div>
    </div>

    <div class="panel" id="panel3">
      <div class="box">
        <h3>用户列表</h3>
        <div id="userList"></div>
      </div>
    </div>

    <div class="panel" id="panel4">
      <div class="box">
        <h3>歌曲请求</h3>
        <div id="reqList"></div>
      </div>
    </div>
  </div>
</div>

<!-- 删除用户弹窗 -->
<div class="modal-mask" id="delModal">
  <div class="modal-box">
    <button class="close-x" id="closeDel">✕</button>
    <h3>删除用户</h3>
    <div class="modal-text">确定删除用户 <b id="delName" style="color:var(--pink);"></b> 吗？<br>此操作不可恢复。</div>
    <button class="modal-btn danger" onclick="confirmDel()">确认删除</button>
  </div>
</div>

<!-- 修改密码弹窗 -->
<div class="modal-mask" id="editModal">
  <div class="modal-box">
    <button class="close-x" id="closeEdit">✕</button>
    <h3>修改用户密码</h3>
    <div class="field"><label>用户名</label><input id="editName" disabled></div>
    <div class="field"><label>新密码</label><input type="password" id="editPass" placeholder="请输入新密码"></div>
    <div class="modal-err" id="editErr"></div>
    <button class="modal-btn" onclick="confirmEdit()">确认修改</button>
  </div>
</div>

<!-- 删除公告弹窗 -->
<div class="modal-mask" id="delAnnModal">
  <div class="modal-box">
    <button class="close-x" id="closeDelAnn">✕</button>
    <h3>删除公告</h3>
    <div class="modal-text">确定删除这条公告吗？<br>此操作不可撤销。</div>
    <button class="modal-btn danger" onclick="confirmDelAnn()">确认删除</button>
  </div>
</div>

<!-- 清空公告弹窗 -->
<div class="modal-mask" id="clearAnnModal">
  <div class="modal-box">
    <button class="close-x" id="closeClearAnn">✕</button>
    <h3>清空所有公告</h3>
    <div class="modal-text">确定要删除所有公告吗？此操作不可撤销。</div>
    <button class="modal-btn danger" onclick="confirmClearAnn()">确认清空</button>
  </div>
</div>

<!-- 退出登录弹窗 -->
<div class="modal-mask" id="logoutModal">
  <div class="modal-box">
    <button class="close-x" id="closeLogout">✕</button>
    <h3>退出登录</h3>
    <div class="modal-text">已退出登录</div>
    <button class="modal-btn" onclick="confirmLogout()">确 定</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='https://sb.lhb2009.cc.cd';
const PASSWORD='20091030';
const AUTH_HEADER='X-Admin-Password';
const AUTH_KEY='lhb_admin_auth';

// 轻提示
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}

// 管理员登录
function verifyPass(){
  const p=document.getElementById('adminPass').value;
  const err=document.getElementById('adminLoginErr');
  if(p===PASSWORD){
    localStorage.setItem(AUTH_KEY,'1');
    err.textContent='';
    document.getElementById('adminPass').value='';
    enterAdmin();
  } else {
    err.textContent='密码错误，请重试';
    document.getElementById('adminPass').value='';
  }
}
document.getElementById('adminPass').addEventListener('keydown',e=>{ if(e.key==='Enter')verifyPass(); });

function isAuthed(){ return localStorage.getItem(AUTH_KEY)==='1'; }
function enterAdmin(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminPanel').style.display='block';
  document.getElementById('logoutBtn').style.display='inline-block';
  loadAll();
}
function doLogout(){
  document.getElementById('logoutModal').classList.add('show');
}
function confirmLogout(){
  localStorage.removeItem(AUTH_KEY);
  hideModal(document.getElementById('logoutModal'));
  document.getElementById('adminPanel').style.display='none';
  document.getElementById('loginBox').style.display='block';
  document.getElementById('logoutBtn').style.display='none';
  toast('已退出登录');
}
document.getElementById('closeLogout').onclick=()=>hideModal(document.getElementById('logoutModal'));
document.getElementById('logoutModal').addEventListener('click',e=>{ if(e.target.id==='logoutModal')hideModal(e.target); });

document.getElementById('tabs').addEventListener('click',e=>{
  const tab=e.target.closest('.tab'); if(!tab) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
  tab.classList.add('active');
  document.getElementById('panel'+tab.dataset.tab).classList.add('show');
});

function hideModal(el){
  const box=el.querySelector('.modal-box');
  if(box) box.classList.add('modal-out');
  setTimeout(()=>{ el.classList.remove('show'); if(box) box.classList.remove('modal-out'); },180);
}

function authHeaders(json){ const h={[AUTH_HEADER]:PASSWORD}; if(json) h['Content-Type']='application/json'; return h; }
async function loadAll(){ loadAnnHist(); loadUsers(); loadRequests(); }

// 发布公告
async function publishAnn(){
  const content=document.getElementById('annContent').value.trim();
  const msg=document.getElementById('annMsg');
  if(!content){ msg.textContent=''; document.getElementById('annContent').style.borderColor='#f43f5e'; return; }
  try{
    const r=await fetch(API+'/announcement',{method:'POST',headers:authHeaders(true),body:JSON.stringify({content})});
    const data=await r.json();
    if(data&&data.code===0){ msg.textContent='✓ 公告发布成功'; document.getElementById('annContent').value=''; loadAnnHist(); }
    else msg.textContent='发布失败';
  }catch(e){ msg.textContent='网络错误'; }
}

// 公告历史（倒序，最新在上，带删除按钮）
let delAnnId=null;
async function loadAnnHist(){
  const el=document.getElementById('annHist');
  try{
    const r=await fetch(API+'/announcement',{headers:authHeaders()});
    const data=await r.json();
    const list=(data&&data.data)||[];
    if(!list.length){ el.innerHTML='<div class="hist-item">暂无公告</div>'; return; }
    // 最新的在上（倒序）
    const rev=[...list].reverse();
    el.innerHTML=rev.map(a=>`
      <div class="hist-item">
        <div>
          <div class="content">${a.content||a.title||'无内容'}</div>
          <div class="time">🕐 ${a.time||a.created||''}</div>
        </div>
        <span class="del" onclick="openDelAnn(${a.id})">删除</span>
      </div>`).join('');
  }catch(e){ el.innerHTML='<div class="hist-item">加载失败</div>'; }
}
// 删除单条公告
function openDelAnn(id){
  delAnnId=id;
  document.getElementById('delAnnModal').classList.add('show');
}
document.getElementById('closeDelAnn').onclick=()=>hideModal(document.getElementById('delAnnModal'));
document.getElementById('delAnnModal').addEventListener('click',e=>{ if(e.target.id==='delAnnModal')hideModal(e.target); });
async function confirmDelAnn(){
  try{
    const r=await fetch(API+'/announcement',{method:'DELETE',headers:authHeaders(true),body:JSON.stringify({id:delAnnId})});
    const data=await r.json();
    if(data&&data.code===0){ hideModal(document.getElementById('delAnnModal')); toast('已删除公告'); loadAnnHist(); }
    else toast('删除失败');
  }catch(e){ toast('网络错误'); }
}
// 清空所有公告
function showClearConfirm(){ document.getElementById('clearAnnModal').classList.add('show'); }
document.getElementById('closeClearAnn').onclick=()=>hideModal(document.getElementById('clearAnnModal'));
document.getElementById('clearAnnModal').addEventListener('click',e=>{ if(e.target.id==='clearAnnModal')hideModal(e.target); });
async function confirmClearAnn(){
  try{
    const r=await fetch(API+'/announcements',{method:'DELETE',headers:authHeaders(true)});
    const data=await r.json();
    if(data&&data.code===0){ hideModal(document.getElementById('clearAnnModal')); toast('已清空所有公告'); loadAnnHist(); }
    else toast('清空失败');
  }catch(e){ toast('网络错误'); }
}

// 注册用户
async function adminReg(){
  const u=document.getElementById('regUser').value.trim(), p=document.getElementById('regPass').value;
  const msg=document.getElementById('regMsg');
  msg.className='msg';
  if(!u||!p){ msg.textContent='请填写用户名和密码'; return; }
  try{
    const r=await fetch(API+'/register',{method:'POST',headers:authHeaders(true),body:JSON.stringify({username:u,password:p})});
    const data=await r.json();
    if(data&&data.code===0){ msg.textContent='✓ 注册成功'; document.getElementById('regUser').value=''; document.getElementById('regPass').value=''; loadUsers(); }
    else {
      msg.className='msg err';
      msg.textContent=(data&&data.msg)||'注册失败';
    }
  }catch(e){ msg.className='msg err'; msg.textContent='网络错误'; }
}

// 用户列表
async function loadUsers(){
  const el=document.getElementById('userList');
  try{
    const r=await fetch(API+'/users',{headers:authHeaders()});
    const data=await r.json();
    const users=(data&&data.data)||[];
    if(!users.length){ el.innerHTML='<div class="list-item">暂无用户</div>'; return; }
    el.innerHTML=users.map((u,i)=>{
      const name=u.username||u.name||'未知';
      const uid=u.id;
      return `<div class="list-item">
        <span class="nm">${name}<div class="sub">注册于 ${u.created||'未知'}</div></span>
        <span class="edit" onclick="openEdit(${uid},'${name}')">改密</span>
        <span class="del" onclick="openDel(${uid},'${name}')">删除</span>
      </div>`;
    }).join('');
  }catch(e){ el.innerHTML='<div class="list-item">加载失败</div>'; }
}

// 修改密码
let editId=null;
function openEdit(id,name){
  editId=id;
  document.getElementById('editName').value=name;
  document.getElementById('editPass').value='';
  document.getElementById('editErr').textContent='';
  document.getElementById('editModal').classList.add('show');
}
document.getElementById('closeEdit').onclick=()=>hideModal(document.getElementById('editModal'));
document.getElementById('editModal').addEventListener('click',e=>{ if(e.target.id==='editModal')hideModal(e.target); });
async function confirmEdit(){
  const newPass=document.getElementById('editPass').value;
  const err=document.getElementById('editErr');
  if(!newPass){ err.textContent='密码不能为空'; return; }
  try{
    const r=await fetch(API+'/user',{method:'PUT',headers:authHeaders(true),body:JSON.stringify({id:editId,password:newPass})});
    const data=await r.json();
    if(data&&data.code===0){ hideModal(document.getElementById('editModal')); toast('修改成功'); loadUsers(); }
    else err.textContent=(data&&data.msg)||'修改失败';
  }catch(e){ err.textContent='网络错误'; }
}

// 删除用户
let delId=null;
function openDel(id,name){
  delId=id;
  document.getElementById('delName').textContent=name;
  document.getElementById('delModal').classList.add('show');
}
document.getElementById('closeDel').onclick=()=>hideModal(document.getElementById('delModal'));
document.getElementById('delModal').addEventListener('click',e=>{ if(e.target.id==='delModal')hideModal(e.target); });
async function confirmDel(){
  try{
    const r=await fetch(API+'/user',{method:'DELETE',headers:authHeaders(true),body:JSON.stringify({id:delId})});
    const data=await r.json();
    if(data&&data.code===0){ hideModal(document.getElementById('delModal')); toast('已删除用户'); loadUsers(); }
    else toast('删除失败');
  }catch(e){ toast('网络错误'); }
}

// 歌曲请求
async function loadRequests(){
  const el=document.getElementById('reqList');
  try{
    const r=await fetch(API+'/requests',{headers:authHeaders()});
    const data=await r.json();
    const reqs=(data&&data.data)||[];
    if(!reqs.length){ el.innerHTML='<div class="list-item">暂无歌曲请求</div>'; return; }
    el.innerHTML=reqs.map(q=>`
      <div class="list-item">
        <span class="nm">🎵 ${q.song||q.name||'未知'}<div class="sub">${q.time||''} · ${q.user||'匿名'}</div></span>
        <span class="del" onclick="delReq(${q.id})">删除</span>
      </div>`).join('');
  }catch(e){ el.innerHTML='<div class="list-item">加载失败</div>'; }
}
async function delReq(id){
  try{
    const r=await fetch(API+'/request',{method:'DELETE',headers:authHeaders(true),body:JSON.stringify({id})});
    const data=await r.json();
    if(data&&data.code===0) loadRequests(); else toast('操作失败');
  }catch(e){ toast('网络错误'); }
}

// 初始化
if(isAuthed()){
  enterAdmin();
} else {
  document.getElementById('loginBox').style.display='block';
}
</script>
