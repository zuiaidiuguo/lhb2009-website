<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>网盘工具 - 工具箱</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#0d0d1a 0%,#1a0d2a 35%,#2a1040 70%,#0d0a1a 100%);
  min-height:100vh; color:#f3e8ff;
}
.wrap { max-width:860px; margin:0 auto; padding:16px; padding-bottom:40px; }
.topbar { display:flex; align-items:center; gap:14px; padding:14px 4px 18px; }
.back { font-size:28px; color:#22d3ee; cursor:pointer; text-decoration:none; }
.title { font-size:24px; font-weight:800; color:#22d3ee; }

/* 工具包列表 */
.list { display:flex; flex-direction:column; gap:12px; }
.item {
  display:flex; align-items:center; gap:16px; padding:18px 20px; border-radius:16px; cursor:pointer;
  background:rgba(50,20,70,.4); border:1px solid rgba(34,211,238,.35);
  transition:transform .3s, box-shadow .3s;
}
.item:hover { transform:scale(1.03); box-shadow:0 0 24px rgba(34,211,238,.4); }
.item .ico { font-size:34px; }
.item .nm { flex:1; font-size:17px; font-weight:600; }
.item .dl { font-size:13px; color:#22d3ee; border:1px solid rgba(34,211,238,.5); padding:6px 14px; border-radius:20px; }

/* 验证码弹窗 */
.modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; z-index:999; }
.modal-mask.show { display:flex; }
.modal-box { width:90%; max-width:340px; background:#1a1030; border:1px solid rgba(168,85,247,.4); border-radius:18px; padding:26px 22px; position:relative; text-align:center; }
.close-x { position:absolute; top:10px; right:14px; font-size:22px; color:#8b84a8; cursor:pointer; background:none; border:none; }
.close-x:hover { color:#fff; }
.modal-box h3 { margin-bottom:6px; font-size:20px; color:#d8b4fe; }
.hint { font-size:13px; color:#8b84a8; margin-bottom:16px; }
.captcha-code { font-size:34px; letter-spacing:10px; font-weight:800; color:#c084fc; margin-bottom:16px; user-select:none; }
.captcha-input { width:100%; padding:12px; border-radius:12px; border:1px solid rgba(168,85,247,.4); background:rgba(255,255,255,.05); color:#fff; font-size:22px; letter-spacing:8px; text-align:center; outline:none; }
.captcha-input:focus { border-color:#c084fc; }
.err { color:#f87171; font-size:14px; margin-top:12px; min-height:20px; }
.modal-btn { width:100%; padding:12px; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; margin-top:10px;
  background:linear-gradient(90deg,#a855f7,#7c3aed); color:#fff; }
.modal-btn:hover { filter:brightness(1.1); }
.modal-btn:disabled { opacity:.5; }
.footer { text-align:center; color:#6d6288; font-size:12px; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <span class="title">📦 网盘工具</span>
  </div>

  <div class="list" id="list"></div>
  <div class="footer">LHB 工具箱 © 2026</div>
</div>

<!-- 验证码弹窗 -->
<div class="modal-mask" id="captchaModal">
  <div class="modal-box">
    <button class="close-x" id="closeCaptcha">✕</button>
    <h3>下载验证</h3>
    <div class="hint">请输入4位验证码</div>
    <div class="captcha-code" id="captchaCode">1234</div>
    <input class="captcha-input" id="captchaInput" maxlength="4" inputmode="numeric" placeholder="····" autocomplete="off">
    <div class="err" id="captchaErr"></div>
    <button class="modal-btn" id="btnConfirm" onclick="verifyCaptcha()" disabled>确认下载</button>
  </div>
</div>

<script>
const CDN='https://cdn.jsdelivr.net/gh/zuiaidiuguo/lhb2009-website@master/';
const tools=[
  {name:'截屏',file:'截屏.zip',icon:'📸'},
  {name:'解压',file:'解压.zip',icon:'🗜️'},
  {name:'硬件检测工具',file:'硬件检测工具.zip',icon:'💻'},
  {name:'win7激活工具',file:'win7激活工具.zip',icon:'🖥️'},
  {name:'全能激活工具',file:'全能激活工具.zip',icon:'⚡'},
  {name:'Dism++系统修复',file:'Dism++系统修复.zip',icon:'🔧'},
  {name:'搞机工具箱11.1.2',file:'搞机工具箱11.1.2.7z',icon:'🤖'},
  {name:'搜索工具',file:'搜索工具.zip',icon:'🔍'},
  {name:'网络工具',file:'网络工具.zip',icon:'🌐'},
  {name:'复制文件工具',file:'复制文件工具.zip',icon:'📋'},
  {name:'误删文件恢复工具',file:'误删文件恢复工具.zip',icon:'♻️'}
];

const listEl=document.getElementById('list');
function renderList(){
  listEl.innerHTML='';
  tools.forEach(t=>{
    const d=document.createElement('div');
    d.className='item';
    d.innerHTML=`<span class="ico">${t.icon}</span><span class="nm">${t.name}</span><span class="dl">下载</span>`;
    d.onclick=()=>openCaptcha(t);
    listEl.appendChild(d);
  });
}

// 验证码
let currentTool=null, captchaCode='';
function genCaptcha(){ captchaCode=String(Math.floor(1000+Math.random()*9000)); document.getElementById('captchaCode').textContent=captchaCode; }
function openCaptcha(tool){
  currentTool=tool;
  genCaptcha();
  const inp=document.getElementById('captchaInput');
  inp.value=''; document.getElementById('captchaErr').textContent=''; document.getElementById('btnConfirm').disabled=true;
  document.getElementById('captchaModal').classList.add('show');
  setTimeout(()=>inp.focus(),100);
}

const input=document.getElementById('captchaInput');
input.addEventListener('input',()=>{
  const v=input.value;
  document.getElementById('btnConfirm').disabled = v.length<4;
  if(v.length===4) verifyCaptcha();
});

function verifyCaptcha(){
  const v=input.value;
  if(v===captchaCode){
    document.getElementById('captchaErr').textContent='';
    document.getElementById('captchaModal').classList.remove('show');
    const url=CDN+encodeURIComponent(currentTool.file);
    const a=document.createElement('a');
    a.href=url; a.download=currentTool.file; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>{ if(!document.getElementById('captchaModal').classList.contains('show')) alert('开始下载：'+currentTool.name); },200);
  } else {
    const err=document.getElementById('captchaErr');
    err.textContent='验证码错误，请重新输入';
    setTimeout(()=>{ err.textContent=''; genCaptcha(); input.value=''; document.getElementById('btnConfirm').disabled=true; },1200);
  }
}

// 关闭
function closeCaptcha(){ document.getElementById('captchaModal').classList.remove('show'); }
document.getElementById('closeCaptcha').onclick=closeCaptcha;
document.getElementById('captchaModal').addEventListener('click',e=>{ if(e.target.id==='captchaModal')closeCaptcha(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCaptcha(); });

renderList();
</script>
</body>
</html>
