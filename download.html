<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>网盘工具 - LHB 工具箱</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
  background-attachment: fixed; min-height: 100vh; color: #e8e8f0;
}
.container { max-width: 900px; margin: 0 auto; padding: 16px; }

.header { display:flex; align-items:center; gap:14px; padding: 20px 4px 16px; }
.back-btn {
  width: 38px; height: 38px; border-radius: 50%; border:none; cursor:pointer;
  background: rgba(255,255,255,.1); color:#e8e8f0; font-size:18px;
  display:flex; align-items:center; justify-content:center; transition: all .2s;
}
.back-btn:hover { background: rgba(255,255,255,.2); }
.header h1 { font-size: 24px; font-weight:700;
  background: linear-gradient(90deg,#7c8cff,#a78bfa);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

.tool-list { display:flex; flex-direction:column; gap:14px; padding-top:8px; }
.tool-item {
  display:flex; align-items:center; gap:18px;
  background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
  border-radius: 16px; padding: 22px 20px; cursor:pointer; transition: all .25s;
}
.tool-item:hover { background: rgba(255,255,255,.1); transform: translateY(-2px); }
.tool-item .icon { font-size: 34px; }
.tool-item .info { flex:1; }
.tool-item .info h2 { font-size: 18px; margin-bottom:4px; }
.tool-item .info p { font-size:13px; color:rgba(232,232,240,.55); }
.tool-item .dl { color: rgba(124,140,255,.8); font-size:13px; }

/* 验证码模态框 */
.modal {
  display:none; position:fixed; inset:0; z-index:100;
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  align-items:center; justify-content:center; padding:16px;
}
.modal.show { display:flex; }
.modal-box {
  background:#1a1a2e; border:1px solid rgba(255,255,255,.1);
  border-radius:18px; width:100%; max-width:340px; padding:24px; text-align:center;
}
.modal-box h3 { font-size:18px; margin-bottom:6px; }
.modal-box .hint { font-size:13px; color:rgba(232,232,240,.6); margin-bottom:16px; }
.captcha-box {
  font-size:28px; font-weight:700; letter-spacing:8px; padding:14px;
  background: rgba(255,255,255,.06); border-radius:12px; margin-bottom:14px;
  user-select:none; cursor:pointer; color:#a78bfa;
}
.captcha-input {
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.06); color:#e8e8f0; font-size:20px; text-align:center;
  letter-spacing:6px; outline:none; margin-bottom:14px;
}
.captcha-input:focus { border-color:#7c8cff; }
.btn-primary {
  width:100%; padding:13px; border:none; border-radius:12px; cursor:pointer;
  background: linear-gradient(135deg,#7c8cff,#a78bfa); color:#fff; font-size:15px; font-weight:600;
}
.btn-primary:hover { filter:brightness(1.1); }
.captcha-refresh { font-size:12px; color:rgba(232,232,240,.5); margin-top:10px; cursor:pointer; }
.msg { font-size:13px; margin-top:10px; padding:8px; border-radius:8px; display:none; }
.msg.err { display:block; background:rgba(255,80,80,.15); color:#ff8a8a; }
.msg.ok { display:block; background:rgba(80,200,120,.15); color:#7edba0; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <button class="back-btn" onclick="location.href='index.html'">←</button>
    <h1>网盘工具</h1>
  </div>

  <div class="tool-list" id="toolList">
    <!-- 工具包列表由 JS 渲染 -->
  </div>
</div>

<!-- 验证码模态框 -->
<div class="modal" id="captchaModal">
  <div class="modal-box">
    <h3 id="dlTitle">下载</h3>
    <div class="hint">请输入 4 位数字验证码</div>
    <div class="captcha-box" id="captchaBox" onclick="refreshCaptcha()">----</div>
    <input class="captcha-input" id="captchaInput" maxlength="4" inputmode="numeric" placeholder="····">
    <button class="btn-primary" onclick="verifyCaptcha()">确认下载</button>
    <div class="captcha-refresh" onclick="refreshCaptcha()">点击验证码刷新</div>
    <div class="msg" id="captchaMsg"></div>
  </div>
</div>

<script>
const API = 'https://sb.lhb2009.cc.cd';

// 示例工具包数据
const tools = [
  { name:'LHB 工具箱 v1.0', desc:'主程序安装包', icon:'📦', url:'/files/lhb-tools-v1.0.apk' },
  { name:'音乐播放器扩展', desc:'音乐功能增强包', icon:'🎵', url:'/files/music-pack.zip' },
  { name:'网盘助手', desc:'网盘下载辅助工具', icon:'💾', url:'/files/pan-helper.apk' },
  { name:'主题皮肤包', desc:'深色主题皮肤', icon:'🎨', url:'/files/theme-pack.zip' }
];

let currentTool = null;
let captchaCode = '';

// 渲染列表
function renderList() {
  const list = document.getElementById('toolList');
  list.innerHTML = '';
  tools.forEach(t => {
    const div = document.createElement('div');
    div.className = 'tool-item';
    div.innerHTML = `
      <div class="icon">${t.icon}</div>
      <div class="info">
        <h2>${t.name}</h2>
        <p>${t.desc}</p>
      </div>
      <div class="dl">下载 ↓</div>`;
    div.onclick = () => openCaptcha(t);
    list.appendChild(div);
  });
}

// 生成 4 位数字验证码
function genCaptcha() {
  captchaCode = '';
  for (let i=0; i<4; i++) captchaCode += Math.floor(Math.random()*10);
  document.getElementById('captchaBox').textContent = captchaCode;
}

function refreshCaptcha() {
  genCaptcha();
  document.getElementById('captchaInput').value = '';
  document.getElementById('captchaMsg').className = 'msg';
  document.getElementById('captchaMsg').textContent = '';
}

function openCaptcha(tool) {
  currentTool = tool;
  document.getElementById('dlTitle').textContent = '下载：' + tool.name;
  document.getElementById('captchaInput').value = '';
  document.getElementById('captchaMsg').className = 'msg';
  document.getElementById('captchaMsg').textContent = '';
  refreshCaptcha();
  document.getElementById('captchaModal').classList.add('show');
  setTimeout(()=>document.getElementById('captchaInput').focus(), 100);
}

function verifyCaptcha() {
  const input = document.getElementById('captchaInput').value;
  const msg = document.getElementById('captchaMsg');
  if (input === captchaCode) {
    msg.className = 'msg ok';
    msg.textContent = '验证成功，即将开始下载...';
    setTimeout(() => {
      document.getElementById('captchaModal').classList.remove('show');
      // 触发下载
      const a = document.createElement('a');
      a.href = API + currentTool.url;
      a.download = '';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, 800);
  } else {
    msg.className = 'msg err';
    msg.textContent = '验证码错误，已刷新';
    refreshCaptcha();
  }
}

// ESC 关闭
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('captchaModal').classList.remove('show');
});
document.getElementById('captchaModal').addEventListener('click', e => {
  if (e.target === document.getElementById('captchaModal')) document.getElementById('captchaModal').classList.remove('show');
});

renderList();
</script>
</body>
</html>
