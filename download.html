<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>网盘工具 - 工具箱</title>
<style>
:root{
  --bg1:#f0f4ff; --bg2:#e8f0fe; --bg3:#f5f0ff;
  --card:#ffffff;
  --primary:#4f7cff;
  --purple:#a855f7; --pink:#f472b6; --cyan:#06b6d4; --orange:#fb923c;
  --text:#1a1a2e; --text2:#4a4a6a;
  --border:#e8ecf4;
  --shadow:0 8px 24px rgba(79,124,255,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{scrollbar-width:thin;scrollbar-color:var(--cyan) var(--border);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg2);border-radius:8px;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--cyan),var(--primary));border-radius:8px;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
  min-height:100vh; color:var(--text);
  animation:fadeUp .4s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:860px;margin:0 auto;padding:16px;padding-bottom:40px;}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 4px 18px;}
.back{font-size:30px;color:var(--cyan);cursor:pointer;text-decoration:none;font-weight:700;}
.title{font-size:24px;font-weight:800;
  background:linear-gradient(90deg,var(--cyan),var(--primary));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* 工具包列表 */
.list{display:flex;flex-direction:column;gap:12px;}
.item{
  display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border-radius:16px;cursor:pointer;
  background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);
  transition:transform .25s ease,box-shadow .25s ease;
}
.item:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 12px 30px rgba(6,182,212,.28);}
.item .nm{font-size:17px;font-weight:600;color:var(--text);}
.item .dl{font-size:13px;color:#fff;background:linear-gradient(90deg,var(--cyan),var(--primary));padding:6px 16px;border-radius:20px;box-shadow:0 4px 12px rgba(6,182,212,.3);}

/* 验证码弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(30,40,80,.4);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:999;}
.modal-mask.show{display:flex;}
.modal-box{width:90%;max-width:340px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px 22px;position:relative;text-align:center;
  box-shadow:0 20px 50px rgba(79,124,255,.25);animation:modalIn .25s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.close-x{position:absolute;top:10px;right:14px;font-size:22px;color:var(--text2);cursor:pointer;background:none;border:none;}
.close-x:hover{color:var(--purple);}
.modal-box h3{margin-bottom:6px;font-size:20px;color:var(--text);}
.hint{font-size:13px;color:var(--text2);margin-bottom:16px;}
.captcha-code{font-size:34px;letter-spacing:10px;font-weight:800;margin-bottom:16px;user-select:none;
  background:linear-gradient(90deg,var(--primary),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.captcha-input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:#f7f9ff;color:var(--text);font-size:22px;letter-spacing:8px;text-align:center;outline:none;transition:border-color .2s;}
.captcha-input:focus{border-color:var(--primary);}
.err{color:#f43f5e;font-size:14px;margin-top:12px;min-height:20px;}

/* 轻提示 */
.toast{position:fixed;left:50%;top:15%;transform:translateX(-50%) translateY(-10px);background:var(--card);color:var(--text);
  padding:12px 22px;border-radius:12px;box-shadow:0 10px 30px rgba(79,124,255,.3);font-size:15px;font-weight:600;z-index:2000;opacity:0;
  border:1px solid var(--border);transition:opacity .3s ease,transform .3s ease;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <span class="title">📦 网盘工具</span>
  </div>

  <div class="list" id="list"></div>
</div>

<!-- 验证码弹窗 -->
<div class="modal-mask" id="captchaModal">
  <div class="modal-box">
    <button class="close-x" id="closeCaptcha">✕</button>
    <h3>下载验证</h3>
    <div class="hint">请输入4位验证码</div>
    <div class="captcha-code" id="captchaCode">1234</div>
    <input class="captcha-input" id="captchaInput" maxlength="4" inputmode="numeric" placeholder="····" autocomplete="off">
    <div class="err" id="captchaErr"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CDN='https://cdn.jsdmirror.cn/gh/zuiaidiuguo/lhb2009-website@master/';
const tools=[
  {name:'截屏',file:'截屏.zip'},
  {name:'解压',file:'解压.zip'},
  {name:'硬件检测工具',file:'硬件检测工具.zip'},
  {name:'win7激活工具',file:'win7激活工具.zip'},
  {name:'全能激活工具',file:'全能激活工具.zip'},
  {name:'Dism++系统修复',file:'Dism++系统修复.zip'},
  {name:'搞机工具箱11.1.2',file:'搞机工具箱11.1.2.7z'},
  {name:'搜索工具',file:'搜索工具.zip'},
  {name:'网络工具',file:'网络工具.zip'},
  {name:'复制文件工具',file:'复制文件工具.zip'},
  {name:'误删文件恢复工具',file:'误删文件恢复工具.zip'}
];

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}

const listEl=document.getElementById('list');
function renderList(){
  listEl.innerHTML='';
  tools.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='item';
    d.style.animation='itemIn .3s ease '+(i*0.05)+'s both';
    // 列表只显示文件名
    d.innerHTML=`<span class="nm">${t.file}</span><span class="dl">下载</span>`;
    d.onclick=()=>openCaptcha(t);
    listEl.appendChild(d);
  });
}
const itemInKey='@keyframes itemIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}';
const style=document.createElement('style');style.textContent=itemInKey;document.head.appendChild(style);

// 验证码
let currentTool=null, captchaCode='';
function genCaptcha(){ captchaCode=String(Math.floor(1000+Math.random()*9000)); document.getElementById('captchaCode').textContent=captchaCode; }
function openCaptcha(tool){
  currentTool=tool;
  genCaptcha();
  const inp=document.getElementById('captchaInput');
  inp.value=''; document.getElementById('captchaErr').textContent='';
  document.getElementById('captchaModal').classList.add('show');
  setTimeout(()=>inp.focus(),100);
}

const input=document.getElementById('captchaInput');
input.addEventListener('input',()=>{
  const v=input.value;
  if(v.length===4) autoVerify(v); // 输入满4位自动匹配
});

// 输入4位后自动匹配，正确即触发下载
function autoVerify(v){
  if(v===captchaCode){
    document.getElementById('captchaErr').textContent='';
    document.getElementById('captchaModal').classList.remove('show');
    const url=CDN+encodeURIComponent(currentTool.file);
    const a=document.createElement('a');
    a.href=url; a.download=currentTool.file; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
    toast('开始下载：'+currentTool.file);
  } else {
    const err=document.getElementById('captchaErr');
    err.textContent='验证码错误，请重新输入';
    setTimeout(()=>{ err.textContent=''; genCaptcha(); input.value=''; },1200);
  }
}

// 关闭
function closeCaptcha(){ document.getElementById('captchaModal').classList.remove('show'); }
document.getElementById('closeCaptcha').onclick=closeCaptcha;
document.getElementById('captchaModal').addEventListener('click',e=>{ if(e.target.id==='captchaModal')closeCaptcha(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCaptcha(); });

renderList();
</script>
</body>
</html>
