<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>下载 - 工具箱</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #0d1a2d 0%, #132b3a 50%, #1a2a3a 100%);
  background-attachment: fixed; min-height: 100vh; color: #e6f0fa;
}
.container { max-width: 720px; margin: 0 auto; padding: 16px; }

.header { display:flex; align-items:center; gap:14px; padding: 20px 4px 16px; }
.back-btn {
  width: 38px; height: 38px; border-radius: 50%; border:none; cursor:pointer;
  background: rgba(20,60,80,.4); color:#e6f0fa; font-size:18px;
  display:flex; align-items:center; justify-content:center; border:1px solid #2a4a5a;
}
.back-btn:hover { background: rgba(20,60,80,.6); }
.header h1 {
  font-size: 24px; font-weight:700;
  background: linear-gradient(90deg, #4f7cff, #00c6ff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}

/* 工具列表 */
.tool-list { display:flex; flex-direction:column; gap:12px; padding-top:8px; }
.tool-item {
  display:flex; align-items:center; gap:16px;
  background: rgba(20,60,80,.3); border:1px solid #2a4a5a;
  border-radius:14px; padding: 18px 20px; cursor:pointer; transition: all .25s;
}
.tool-item:hover { background: rgba(20,60,80,.5); border-color:#00d4ff; transform: translateY(-2px); }
.tool-item .icon { font-size: 28px; }
.tool-item .name { flex:1; font-size:16px; font-weight:500; }
.tool-item .dl { color:#00d4ff; font-size:14px; }

/* 验证码模态框 */
.modal {
  display:none; position:fixed; inset:0; z-index:100;
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  align-items:center; justify-content:center; padding:16px;
}
.modal.show { display:flex; }
.modal-box {
  background:#132b3a; border:1px solid #2a4a5a;
  border-radius:18px; width:100%; max-width:340px; padding:24px; text-align:center;
  position:relative;
}
.modal-close {
  position:absolute; top:10px; right:14px; background:none; border:none;
  color:#8ab4d4; font-size:22px; cursor:pointer; line-height:1;
}
.modal-close:hover { color:#00d4ff; }
.modal-box h3 { font-size:18px; margin-bottom:6px; }
.modal-box .hint { font-size:13px; color:#8ab4d4; margin-bottom:16px; }
.captcha-box {
  font-size:28px; font-weight:700; letter-spacing:8px; padding:14px;
  background: rgba(20,60,80,.3); border:1px solid #2a4a5a; border-radius:12px;
  margin-bottom:14px; user-select:none; cursor:pointer; color:#00d4ff;
}
.captcha-input {
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid #2a4a5a;
  background: rgba(20,60,80,.3); color:#e6f0fa; font-size:20px; text-align:center;
  letter-spacing:6px; outline:none; margin-bottom:14px;
}
.captcha-input:focus { border-color:#00d4ff; }
.btn-primary {
  width:100%; padding:13px; border:none; border-radius:12px; cursor:pointer;
  background: linear-gradient(135deg, #4f7cff, #00c6ff); color:#fff; font-size:15px; font-weight:600;
}
.btn-primary:hover { filter:brightness(1.1); }
.captcha-refresh { font-size:12px; color:#8ab4d4; margin-top:10px; cursor:pointer; }
.msg { font-size:13px; margin-top:10px; padding:8px; border-radius:8px; display:none; }
.msg.err { display:block; background:rgba(255,80,80,.15); color:#ff8a8a; }
.msg.ok { display:block; background:rgba(80,200,120,.15); color:#7edba0; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <button class="back-btn" onclick="location.href='index.html'">←</button>
    <h1>下载</h1>
  </div>

  <div class="tool-list" id="toolList"></div>
</div>

<!-- 验证码模态框 -->
<div class="modal" id="captchaModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeCaptcha()">&times;</button>
    <h3 id="dlTitle">下载</h3>
    <div class="hint">请输入 4 位数字验证码</div>
    <div class="captcha-box" id="captchaBox" onclick="refreshCaptcha()">----</div>
    <input class="captcha-input" id="captchaInput" maxlength="4" inputmode="numeric" placeholder="····">
    <button class="btn-primary" onclick="verifyCaptcha()">确认下载</button>
    <div class="captcha-refresh" onclick="refreshCaptcha()">点击验证码刷新</div>
    <div class="msg" id="captchaMsg"></div>
  </div>
</div>

<script>
const API = 'https://sb.lhb2009.cc.cd';

// 工具包列表（真实 CDN 地址）
const CDN = 'https://cdn.jsdelivr.net/gh/zuiaidiuguo/lhb2009-website@master';
const tools = [
  { name:'截屏.zip', icon:'📸', url: CDN + '/files/截屏.zip' },
  { name:'解压.zip', icon:'🗜️', url: CDN + '/files/解压.zip' },
  { name:'硬件检测工具.zip', icon:'🔧', url: CDN + '/files/硬件检测工具.zip' },
  { name:'win7激活工具.zip', icon:'💻', url: CDN + '/files/win7激活工具.zip' },
  { name:'全能激活工具.zip', icon:'⚡', url: CDN + '/files/全能激活工具.zip' },
  { name:'Dism++系统修复.zip', icon:'🛠️', url: CDN + '/files/Dism++系统修复.zip' },
  { name:'搞机工具箱11.1.2.7z', icon:'📦', url: CDN + '/files/搞机工具箱11.1.2.7z' },
  { name:'搜索工具.zip', icon:'🔍', url: CDN + '/files/搜索工具.zip' },
  { name:'网络工具.zip', icon:'🌐', url: CDN + '/files/网络工具.zip' },
  { name:'复制文件工具.zip', icon:'📋', url: CDN + '/files/复制文件工具.zip' },
  { name:'误删文件恢复工具.zip', icon:'♻️', url: CDN + '/files/误删文件恢复工具.zip' }
];

let currentTool = null;
let captchaCode = '';

function renderList() {
  const list = document.getElementById('toolList');
  list.innerHTML = '';
  tools.forEach(t => {
    const div = document.createElement('div');
    div.className = 'tool-item';
    div.innerHTML = `
      <div class="icon">${t.icon}</div>
      <div class="name">${t.name}</div>
      <div class="dl">下载 ↓</div>`;
    div.onclick = () => openCaptcha(t);
    list.appendChild(div);
  });
}

function genCaptcha() {
  captchaCode = '';
  for (let i=0; i<4; i++) captchaCode += Math.floor(Math.random()*10);
  document.getElementById('captchaBox').textContent = captchaCode;
}

function refreshCaptcha() {
  genCaptcha();
  document.getElementById('captchaInput').value = '';
  document.getElementById('captchaMsg').className = 'msg';
  document.getElementById('captchaMsg').textContent = '';
}

function openCaptcha(tool) {
  currentTool = tool;
  document.getElementById('dlTitle').textContent = '下载：' + tool.name;
  document.getElementById('captchaInput').value = '';
  document.getElementById('captchaMsg').className = 'msg';
  document.getElementById('captchaMsg').textContent = '';
  refreshCaptcha();
  document.getElementById('captchaModal').classList.add('show');
  setTimeout(()=>document.getElementById('captchaInput').focus(), 100);
}

function closeCaptcha() {
  document.getElementById('captchaModal').classList.remove('show');
}

function verifyCaptcha() {
  const input = document.getElementById('captchaInput').value;
  const msg = document.getElementById('captchaMsg');
  if (input === captchaCode) {
    msg.className = 'msg ok';
    msg.textContent = '验证成功，即将开始下载...';
    setTimeout(() => {
      closeCaptcha();
      const a = document.createElement('a');
      a.href = currentTool.url;
      a.download = '';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, 800);
  } else {
    msg.className = 'msg err';
    msg.textContent = '验证码错误，已刷新';
    refreshCaptcha();
  }
}

// ESC 关闭
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeCaptcha();
});
document.getElementById('captchaModal').addEventListener('click', e => {
  if (e.target === document.getElementById('captchaModal')) closeCaptcha();
});

renderList();
</script>
</body>
</html>
