<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>收藏夹 - 工具箱</title>
<style>
:root{
  --bg1:#f0f4ff; --bg2:#e8f0fe; --bg3:#f5f0ff;
  --card:#ffffff;
  --primary:#4f7cff;
  --purple:#a855f7; --pink:#f472b6; --cyan:#06b6d4; --orange:#fb923c;
  --text:#1a1a2e; --text2:#4a4a6a;
  --border:#e8ecf4;
  --shadow:0 8px 24px rgba(79,124,255,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{scrollbar-width:thin;scrollbar-color:var(--pink) var(--border);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg2);border-radius:8px;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--pink),var(--purple));border-radius:8px;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
  min-height:100vh; color:var(--text);
  animation:fadeUp .4s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:860px;margin:0 auto;padding:16px;padding-bottom:40px;}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 4px 18px;}
.back{font-size:30px;color:var(--pink);cursor:pointer;text-decoration:none;font-weight:700;}
.title{font-size:24px;font-weight:800;flex:1;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.topright{display:flex;align-items:center;gap:10px;}
.username{color:var(--purple);font-size:14px;font-weight:700;}

/* 排序工具栏 */
.sortbar{display:flex;gap:10px;margin-bottom:16px;}
.sortbtn{flex:1;padding:11px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:var(--card);color:var(--text2);box-shadow:var(--shadow);transition:all .25s;}
.sortbtn.active{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;border-color:transparent;}

/* 一键播放 */
.playall{width:100%;padding:14px;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:18px;color:#fff;
  background:linear-gradient(90deg,var(--pink),var(--purple));box-shadow:0 6px 18px rgba(244,114,182,.35);
  transition:transform .15s ease;}
.playall:active{transform:scale(.96);}
.playall:disabled{opacity:.5;cursor:not-allowed;}

/* 收藏列表 */
.favlist{display:flex;flex-direction:column;gap:10px;}
.fav{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;cursor:pointer;
  background:var(--card);border:1px solid var(--border);border-left:4px solid var(--pink);box-shadow:var(--shadow);
  transition:transform .25s ease,box-shadow .25s ease;
}
.fav:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 10px 24px rgba(244,114,182,.22);}
.fav .handle{font-size:22px;color:var(--text2);cursor:grab;user-select:none;}
.fav .handle:active{cursor:grabbing;}
.fav .nm{flex:1;font-size:16px;font-weight:600;color:var(--text);}
.fav .rm{font-size:13px;color:#f43f5e;border:1px solid var(--pink);padding:5px 12px;border-radius:14px;cursor:pointer;background:#fff;transition:all .2s;}
.fav .rm:hover{background:linear-gradient(90deg,#fb7185,#f43f5e);color:#fff;}

/* 空状态 */
.empty{text-align:center;padding:60px 0;color:var(--text2);}
.empty .big{font-size:50px;margin-bottom:14px;}
.empty p{font-size:16px;}

/* 登录弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(30,40,80,.4);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:999;}
.modal-mask.show{display:flex;}
.modal-box{width:90%;max-width:340px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px 22px;position:relative;
  box-shadow:0 20px 50px rgba(79,124,255,.25);animation:modalIn .25s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.modal-box h3{text-align:center;margin-bottom:18px;font-size:20px;color:var(--text);}
.close-x{position:absolute;top:10px;right:14px;font-size:22px;color:var(--text2);cursor:pointer;background:none;border:none;}
.close-x:hover{color:var(--purple);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;}
.field input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:#f7f9ff;color:var(--text);font-size:15px;outline:none;transition:border-color .2s;}
.field input:focus{border-color:var(--pink);}
.modal-btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;color:#fff;
  background:linear-gradient(90deg,var(--primary),var(--purple));box-shadow:0 6px 16px rgba(79,124,255,.3);
  transition:transform .15s ease;}
.modal-btn:active{transform:scale(.96);}
.err{color:#f43f5e;font-size:13px;text-align:center;margin-top:8px;min-height:18px;}
.switch{text-align:center;margin-top:14px;font-size:13px;color:var(--text2);}
.switch a{color:var(--primary);cursor:pointer;font-weight:600;}

/* 提示小方框（未登录） */
.login-hint{
  position:fixed;left:50%;top:35%;transform:translateX(-50%) translateY(-10px);
  background:var(--card);color:var(--text);padding:14px 26px;border-radius:14px;
  box-shadow:0 12px 34px rgba(79,124,255,.3);font-size:15px;font-weight:600;z-index:3000;
  border:2px solid var(--pink);opacity:0;pointer-events:none;
  transition:opacity .35s ease,transform .35s ease;
}
.login-hint.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="music.html">‹</a>
    <span class="title">♡ 收藏夹</span>
    <div class="topright">
      <span class="username" id="username"></span>
    </div>
  </div>

  <div class="sortbar">
    <button class="sortbtn" id="sortAlpha" onclick="toggleAlpha()">字母排序</button>
    <button class="sortbtn" id="sortTime" onclick="toggleTime()">时间排序</button>
  </div>

  <button class="playall" id="playAll" onclick="playAll()">▶ 一键播放全部</button>

  <div class="favlist" id="favlist"></div>
  <div class="empty" id="empty" style="display:none;">
    <div class="big">🎵</div>
    <p>暂无收藏歌曲</p>
  </div>
</div>

<!-- 未登录提示小方框 -->
<div class="login-hint" id="loginHint">你还未登录，请先登录</div>

<!-- 登录弹窗 -->
<div class="modal-mask" id="loginModal">
  <div class="modal-box">
    <button class="close-x" id="closeLogin">✕</button>
    <h3>登录</h3>
    <div class="field"><label>用户名</label><input id="loginUser" placeholder="请输入用户名"></div>
    <div class="field"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码"></div>
    <div class="err" id="loginErr"></div>
    <button class="modal-btn" onclick="doLogin()">登 录</button>
    <div class="switch">没有账号？<a onclick="showReg()">立即注册</a></div>
  </div>
</div>

<!-- 注册弹窗 -->
<div class="modal-mask" id="regModal">
  <div class="modal-box">
    <button class="close-x" id="closeReg">✕</button>
    <h3>注册</h3>
    <div class="field"><label>用户名</label><input id="regUser" placeholder="请输入用户名"></div>
    <div class="field"><label>密码</label><input id="regPass" type="password" placeholder="请输入密码"></div>
    <div class="err" id="regErr"></div>
    <button class="modal-btn" onclick="doReg()">注 册</button>
    <div class="switch">已有账号？<a onclick="showLogin()">去登录</a></div>
  </div>
</div>

<script>
const API='https://sb.lhb2009.cc.cd';
const FAV_KEY='lhb_fav_';
let favs=[]; // 每项 {name, time}
let sortAlpha='az'; // az / za
let sortTime='asc'; // asc / desc
let dragIndex=null;

function getFavKey(){ const u=localStorage.getItem('lhb_user'); return FAV_KEY+(u||'guest'); }
function loadFavs(){
  try{
    const raw=JSON.parse(localStorage.getItem(getFavKey())||'[]');
    favs=raw.map(x=>typeof x==='string'?{name:x,time:Date.now()}:x);
  }catch(e){ favs=[]; }
}
function saveFavs(){ localStorage.setItem(getFavKey(),JSON.stringify(favs)); }

// 排序状态持久化
function loadSort(){ sortAlpha=localStorage.getItem('lhb_sortAlpha')||'az'; sortTime=localStorage.getItem('lhb_sortTime')||'asc'; }
function saveSort(){ localStorage.setItem('lhb_sortAlpha',sortAlpha); localStorage.setItem('lhb_sortTime',sortTime); updateSortBtns(); }
function updateSortBtns(){
  document.getElementById('sortAlpha').textContent = sortAlpha==='az' ? '字母 A→Z' : '字母 Z→A';
  document.getElementById('sortAlpha').classList.toggle('active', sortAlpha!=='az');
  document.getElementById('sortTime').textContent = sortTime==='asc' ? '时间 正序' : '时间 倒序';
  document.getElementById('sortTime').classList.toggle('active', sortTime!=='asc');
}
function toggleAlpha(){ sortAlpha = sortAlpha==='az' ? 'za' : 'az'; saveSort(); applySort(); }
function toggleTime(){ sortTime = sortTime==='asc' ? 'desc' : 'asc'; saveSort(); applySort(); }

function applySort(){
  let list=[...favs];
  if(sortAlpha==='az') list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  else list.sort((a,b)=>b.name.localeCompare(a.name,'zh'));
  if(sortTime==='asc') list.sort((a,b)=>a.time-b.time);
  else list.sort((a,b)=>b.time-a.time);
  render(list);
  // 保存排序后的顺序（去掉时间字段）
  localStorage.setItem(getFavKey(),JSON.stringify(list.map(x=>x.name)));
}

const listEl=document.getElementById('favlist');
const emptyEl=document.getElementById('empty');
const playBtn=document.getElementById('playAll');

function render(list){
  listEl.innerHTML='';
  const shown=list||favs;
  emptyEl.style.display = shown.length ? 'none' : 'block';
  playBtn.disabled = shown.length===0;
  shown.forEach((item,i)=>{
    const d=document.createElement('div');
    d.className='fav';
    d.style.animation='itemIn .3s ease '+(i*0.05)+'s both';
    d.innerHTML=`<span class="handle" draggable="false">≡</span>
      <span class="nm">${item.name}</span>
      <span class="rm" onclick="removeFav('${i}')">移除</span>`;
    d.querySelector('.handle').addEventListener('mousedown',(e)=>{ e.preventDefault(); dragIndex=i; d.style.opacity='0.5'; });
    d.addEventListener('mouseup',()=>{ if(dragIndex!==null){ d.style.opacity=''; dragIndex=null; } });
    listEl.appendChild(d);
  });
}
const itemInKey='@keyframes itemIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}';
const st=document.createElement('style');st.textContent=itemInKey;document.head.appendChild(st);

// 拖拽排序（鼠标）
listEl.addEventListener('mousemove',(e)=>{
  if(dragIndex===null) return;
  const items=[...listEl.children];
  const target=items[dragIndex];
  const after=items.find(it=>{ const r=it.getBoundingClientRect(); return e.clientY < r.top + r.height/2; });
  if(after && after!==target) listEl.insertBefore(target, after);
});
listEl.addEventListener('mouseup',()=>{ if(dragIndex===null) return; saveDragOrder(); dragIndex=null; render(); });
// 触摸拖拽
listEl.addEventListener('touchstart',(e)=>{
  const handle=e.target.closest('.handle'); if(!handle) return;
  const item=handle.closest('.fav'); dragIndex=[...listEl.children].indexOf(item); item.style.opacity='0.5';
},{passive:true});
listEl.addEventListener('touchmove',(e)=>{
  if(dragIndex===null) return; e.preventDefault();
  const touch=e.touches[0], items=[...listEl.children], target=items[dragIndex];
  const after=items.find(it=>{ const r=it.getBoundingClientRect(); return touch.clientY < r.top + r.height/2 && it!==target; });
  if(after) listEl.insertBefore(target, after);
},{passive:false});
listEl.addEventListener('touchend',()=>{ if(dragIndex===null) return; saveDragOrder(); dragIndex=null; render(); });

function saveDragOrder(){
  const order=[...listEl.children].map(el=>el.querySelector('.nm').textContent);
  const map={}; favs.forEach(f=>map[f.name]=f.time);
  favs=order.map(n=>({name:n,time:map[n]||Date.now()}));
  saveFavs();
}

// 移除收藏
function removeFav(i){
  favs.splice(i,1);
  saveFavs(); applySort();
}

// 一键播放：返回时回到收藏夹界面
function playAll(){
  if(!favs.length) return;
  location.href='music.html?play=fav&from=fav';
}

// 未登录提示小方框 + 自动弹出登录弹窗
function showLoginHint(){
  const hint=document.getElementById('loginHint');
  hint.classList.add('show');
  setTimeout(()=>{
    hint.classList.remove('show');
    setTimeout(()=>showLogin(),400);
  },1500);
}

// 登录/注册
function showLogin(){ document.getElementById('regModal').classList.remove('show'); document.getElementById('loginModal').classList.add('show'); }
function showReg(){ document.getElementById('loginModal').classList.remove('show'); document.getElementById('regModal').classList.add('show'); }
function hideModal(el){
  const box=el.querySelector('.modal-box');
  if(box) box.classList.add('modal-out');
  setTimeout(()=>{ el.classList.remove('show'); if(box) box.classList.remove('modal-out'); },180);
}
document.getElementById('closeLogin').onclick=()=>hideModal(document.getElementById('loginModal'));
document.getElementById('closeReg').onclick=()=>hideModal(document.getElementById('regModal'));
document.getElementById('loginModal').addEventListener('click',e=>{ if(e.target.id==='loginModal')hideModal(e.target); });
document.getElementById('regModal').addEventListener('click',e=>{ if(e.target.id==='regModal')hideModal(e.target); });
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim(), p=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  if(!u||!p){ err.textContent='请填写用户名和密码'; return; }
  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const data=await r.json();
    if(data&&data.code===0){
      localStorage.setItem('lhb_user',u); err.textContent='';
      hideModal(document.getElementById('loginModal'));
      init(); // 登录成功后自动进入收藏夹界面
    } else err.textContent=(data&&data.msg)||'用户名或密码错误';
  }catch(e){ err.textContent='网络错误，请重试'; }
}
async function doReg(){
  const u=document.getElementById('regUser').value.trim(), p=document.getElementById('regPass').value;
  const err=document.getElementById('regErr');
  if(!u||!p){ err.textContent='请填写用户名和密码'; return; }
  try{
    const r=await fetch(API+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const data=await r.json();
    if(data&&data.code===0){
      localStorage.setItem('lhb_user',u); err.textContent='';
      hideModal(document.getElementById('regModal'));
      init();
    } else err.textContent=(data&&data.msg)||'注册失败';
  }catch(e){ err.textContent='网络错误，请重试'; }
}

function init(){
  const u=localStorage.getItem('lhb_user');
  document.getElementById('username').textContent=u||'';
  loadSort(); loadFavs(); applySort();
  // 音乐继续播放，悬浮窗不消失（无需额外处理，播放器在 music.html 独立）
}

// 初始化
if(!localStorage.getItem('lhb_user')){
  showLoginHint(); // 显示「还未登录」提示，然后自动弹登录框
} else {
  init();
}
</script>
</body>
</html>
