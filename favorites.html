<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>收藏夹 - 工具箱</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#0d0d1a 0%,#1a0d2a 35%,#2a1040 70%,#0d0a1a 100%);
  min-height:100vh; color:#f3e8ff;
}
.wrap { max-width:860px; margin:0 auto; padding:16px; padding-bottom:40px; }
.topbar { display:flex; align-items:center; gap:14px; padding:14px 4px 18px; }
.back { font-size:28px; color:#f472b6; cursor:pointer; text-decoration:none; }
.title { font-size:24px; font-weight:800; color:#f472b6; flex:1; }
.topright { display:flex; align-items:center; gap:10px; }
.username { color:#c084fc; font-size:14px; font-weight:600; }
.logout { padding:7px 14px; border-radius:18px; border:1px solid rgba(248,113,113,.4); background:rgba(248,113,113,.15); color:#fca5a5; font-size:13px; cursor:pointer; }

/* 排序工具栏 */
.sortbar { display:flex; gap:10px; margin-bottom:16px; }
.sortbtn { flex:1; padding:11px; border-radius:14px; font-size:14px; font-weight:600; cursor:pointer;
  border:1px solid rgba(168,85,247,.4); background:rgba(255,255,255,.05); color:#a99ec9; transition:all .3s; }
.sortbtn.active { background:linear-gradient(90deg,#a855f7,#7c3aed); color:#fff; border-color:transparent; }

/* 一键播放 */
.playall { width:100%; padding:14px; border:none; border-radius:16px; font-size:16px; font-weight:700; cursor:pointer; margin-bottom:18px;
  background:linear-gradient(90deg,#f472b6,#a855f7); color:#fff; transition:filter .3s; }
.playall:hover { filter:brightness(1.1); }
.playall:disabled { opacity:.5; cursor:not-allowed; }

/* 收藏列表 */
.favlist { display:flex; flex-direction:column; gap:10px; }
.fav {
  display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:14px; cursor:pointer;
  background:rgba(50,20,70,.4); border-left:4px solid #f472b6; transition:transform .3s, box-shadow .3s;
}
.fav:hover { transform:scale(1.02); box-shadow:0 0 20px rgba(244,114,182,.3); }
.fav .handle { font-size:22px; color:#8b84a8; cursor:grab; user-select:none; }
.fav .handle:active { cursor:grabbing; }
.fav .nm { flex:1; font-size:16px; font-weight:600; }
.fav .rm { font-size:13px; color:#f87171; border:1px solid rgba(248,113,113,.4); padding:5px 12px; border-radius:14px; cursor:pointer; }

/* 空状态 */
.empty { text-align:center; padding:60px 0; color:#8b84a8; }
.empty .big { font-size:50px; margin-bottom:14px; }
.empty p { font-size:16px; }

/* 登录弹窗 */
.modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; z-index:999; }
.modal-mask.show { display:flex; }
.modal-box { width:90%; max-width:340px; background:#1a1030; border:1px solid rgba(168,85,247,.4); border-radius:18px; padding:26px 22px; position:relative; }
.modal-box h3 { text-align:center; margin-bottom:18px; font-size:20px; color:#f3e8ff; }
.close-x { position:absolute; top:10px; right:14px; font-size:22px; color:#8b84a8; cursor:pointer; background:none; border:none; }
.close-x:hover { color:#fff; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:13px; color:#a99ec9; margin-bottom:6px; }
.field input { width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(168,85,247,.35); background:rgba(255,255,255,.05); color:#fff; font-size:15px; outline:none; }
.field input:focus { border-color:#f472b6; }
.modal-btn { width:100%; padding:12px; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; margin-top:6px;
  background:linear-gradient(90deg,#a855f7,#7c3aed); color:#fff; }
.modal-btn:hover { filter:brightness(1.1); }
.err { color:#f87171; font-size:13px; text-align:center; margin-top:8px; min-height:18px; }
.switch { text-align:center; margin-top:14px; font-size:13px; color:#a99ec9; }
.switch a { color:#c084fc; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="music.html">‹</a>
    <span class="title">♡ 收藏夹</span>
    <div class="topright">
      <span class="username" id="username"></span>
      <button class="logout" onclick="logout()">退出</button>
    </div>
  </div>

  <div class="sortbar">
    <button class="sortbtn" id="sortAlpha" onclick="toggleAlpha()">字母排序</button>
    <button class="sortbtn" id="sortTime" onclick="toggleTime()">时间排序</button>
  </div>

  <button class="playall" id="playAll" onclick="playAll()">▶ 一键播放全部</button>

  <div class="favlist" id="favlist"></div>
  <div class="empty" id="empty" style="display:none;">
    <div class="big">🎵</div>
    <p>暂无收藏歌曲</p>
  </div>
</div>

<!-- 登录弹窗 -->
<div class="modal-mask" id="loginModal">
  <div class="modal-box">
    <button class="close-x" id="closeLogin">✕</button>
    <h3>登录</h3>
    <div class="field"><label>用户名</label><input id="loginUser" placeholder="请输入用户名"></div>
    <div class="field"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码"></div>
    <div class="err" id="loginErr"></div>
    <button class="modal-btn" onclick="doLogin()">登 录</button>
    <div class="switch">没有账号？<a onclick="showReg()">立即注册</a></div>
  </div>
</div>

<!-- 注册弹窗 -->
<div class="modal-mask" id="regModal">
  <div class="modal-box">
    <button class="close-x" id="closeReg">✕</button>
    <h3>注册</h3>
    <div class="field"><label>用户名</label><input id="regUser" placeholder="请输入用户名"></div>
    <div class="field"><label>密码</label><input id="regPass" type="password" placeholder="请输入密码"></div>
    <div class="err" id="regErr"></div>
    <button class="modal-btn" onclick="doReg()">注 册</button>
    <div class="switch">已有账号？<a onclick="showLogin()">去登录</a></div>
  </div>
</div>

<script>
const API='https://sb.lhb2009.cc.cd';
const FAV_KEY='lhb_fav_';
let favs=[]; // 每项 {name, time}
let sortAlpha='az'; // az / za
let sortTime='asc'; // asc / desc
let dragIndex=null;

function getFavKey(){ const u=localStorage.getItem('lhb_user'); return FAV_KEY+(u||'guest'); }
function loadFavs(){
  try{
    const raw=JSON.parse(localStorage.getItem(getFavKey())||'[]');
    favs=raw.map(x=>typeof x==='string'?{name:x,time:Date.now()}:x);
  }catch(e){ favs=[]; }
}
function saveFavs(){ localStorage.setItem(getFavKey(),JSON.stringify(favs)); }

// 排序状态持久化
function loadSort(){ sortAlpha=localStorage.getItem('lhb_sortAlpha')||'az'; sortTime=localStorage.getItem('lhb_sortTime')||'asc'; }
function saveSort(){ localStorage.setItem('lhb_sortAlpha',sortAlpha); localStorage.setItem('lhb_sortTime',sortTime); updateSortBtns(); }
function updateSortBtns(){
  document.getElementById('sortAlpha').textContent = sortAlpha==='az' ? '字母 A→Z' : '字母 Z→A';
  document.getElementById('sortAlpha').classList.toggle('active', sortAlpha!=='az');
  document.getElementById('sortTime').textContent = sortTime==='asc' ? '时间 正序' : '时间 倒序';
  document.getElementById('sortTime').classList.toggle('active', sortTime!=='asc');
}
function toggleAlpha(){ sortAlpha = sortAlpha==='az' ? 'za' : 'az'; saveSort(); applySort(); }
function toggleTime(){ sortTime = sortTime==='asc' ? 'desc' : 'asc'; saveSort(); applySort(); }

function applySort(){
  let list=[...favs];
  if(sortAlpha==='az') list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  else list.sort((a,b)=>b.name.localeCompare(a.name,'zh'));
  if(sortTime==='asc') list.sort((a,b)=>a.time-b.time);
  else list.sort((a,b)=>b.time-a.time);
  render(list);
  // 保存排序后的顺序（去掉时间字段）
  localStorage.setItem(getFavKey(),JSON.stringify(list.map(x=>x.name)));
}

const listEl=document.getElementById('favlist');
const emptyEl=document.getElementById('empty');
const playBtn=document.getElementById('playAll');

function render(list){
  listEl.innerHTML='';
  const shown=list||favs;
  emptyEl.style.display = shown.length ? 'none' : 'block';
  playBtn.disabled = shown.length===0;
  shown.forEach((item,i)=>{
    const d=document.createElement('div');
    d.className='fav';
    d.innerHTML=`<span class="handle" draggable="false">≡</span>
      <span class="nm">${item.name}</span>
      <span class="rm" onclick="removeFav('${i}')">移除</span>`;
    d.querySelector('.handle').addEventListener('mousedown',(e)=>{ e.preventDefault(); dragIndex=i; d.style.opacity='0.5'; });
    d.addEventListener('mouseup',()=>{ if(dragIndex!==null){ d.style.opacity=''; dragIndex=null; } });
    listEl.appendChild(d);
  });
}

// 拖拽排序（鼠标）
listEl.addEventListener('mousemove',(e)=>{
  if(dragIndex===null) return;
  const items=[...listEl.children];
  const target=items[dragIndex];
  const after=items.find(it=>{ const r=it.getBoundingClientRect(); return e.clientY < r.top + r.height/2; });
  if(after && after!==target) listEl.insertBefore(target, after);
});
listEl.addEventListener('mouseup',()=>{ if(dragIndex===null) return; saveDragOrder(); dragIndex=null; render(); });
// 触摸拖拽
listEl.addEventListener('touchstart',(e)=>{
  const handle=e.target.closest('.handle'); if(!handle) return;
  const item=handle.closest('.fav'); dragIndex=[...listEl.children].indexOf(item); item.style.opacity='0.5';
},{passive:true});
listEl.addEventListener('touchmove',(e)=>{
  if(dragIndex===null) return; e.preventDefault();
  const touch=e.touches[0], items=[...listEl.children], target=items[dragIndex];
  const after=items.find(it=>{ const r=it.getBoundingClientRect(); return touch.clientY < r.top + r.height/2 && it!==target; });
  if(after) listEl.insertBefore(target, after);
},{passive:false});
listEl.addEventListener('touchend',()=>{ if(dragIndex===null) return; saveDragOrder(); dragIndex=null; render(); });

function saveDragOrder(){
  const order=[...listEl.children].map(el=>el.querySelector('.nm').textContent);
  const map={}; favs.forEach(f=>map[f.name]=f.time);
  favs=order.map(n=>({name:n,time:map[n]||Date.now()}));
  saveFavs();
}

// 移除收藏
function removeFav(i){
  favs.splice(i,1);
  saveFavs(); applySort();
}

// 一键播放
function playAll(){
  if(!favs.length) return;
  location.href='music.html?play=fav';
}

// 登录/注册
function showLogin(){ document.getElementById('regModal').classList.remove('show'); document.getElementById('loginModal').classList.add('show'); }
function showReg(){ document.getElementById('loginModal').classList.remove('show'); document.getElementById('regModal').classList.add('show'); }
document.getElementById('closeLogin').onclick=()=>document.getElementById('loginModal').classList.remove('show');
document.getElementById('closeReg').onclick=()=>document.getElementById('regModal').classList.remove('show');
document.getElementById('loginModal').addEventListener('click',e=>{ if(e.target.id==='loginModal')e.target.classList.remove('show'); });
document.getElementById('regModal').addEventListener('click',e=>{ if(e.target.id==='regModal')e.target.classList.remove('show'); });
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim(), p=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  if(!u||!p){ err.textContent='请填写用户名和密码'; return; }
  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const data=await r.json();
    if(data&&data.ok){ localStorage.setItem('lhb_user',u); err.textContent=''; document.getElementById('loginModal').classList.remove('show'); init(); }
    else err.textContent=(data&&data.msg)||'用户名或密码错误';
  }catch(e){ err.textContent='网络错误，请重试'; }
}
async function doReg(){
  const u=document.getElementById('regUser').value.trim(), p=document.getElementById('regPass').value;
  const err=document.getElementById('regErr');
  if(!u||!p){ err.textContent='请填写用户名和密码'; return; }
  try{
    const r=await fetch(API+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const data=await r.json();
    if(data&&data.ok){ localStorage.setItem('lhb_user',u); err.textContent=''; document.getElementById('regModal').classList.remove('show'); init(); }
    else err.textContent=(data&&data.msg)||'注册失败';
  }catch(e){ err.textContent='网络错误，请重试'; }
}
function logout(){ localStorage.removeItem('lhb_user'); location.href='index.html'; }

function init(){
  const u=localStorage.getItem('lhb_user');
  document.getElementById('username').textContent=u||'';
  loadSort(); loadFavs(); applySort();
}

// 初始化
if(!localStorage.getItem('lhb_user')){ showLogin(); }
init();
</script>
</body>
</html>
