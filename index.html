<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>工具箱</title>
<style>
:root{
  --bg1:#f0f4ff; --bg2:#e8f0fe; --bg3:#f5f0ff;
  --card:#ffffff;
  --primary:#4f7cff;
  --purple:#a855f7; --pink:#f472b6; --cyan:#06b6d4; --orange:#fb923c;
  --text:#1a1a2e; --text2:#4a4a6a;
  --border:#e8ecf4;
  --shadow:0 8px 24px rgba(79,124,255,.12);
  --shadow-glow:0 12px 32px rgba(168,85,247,.22);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{scrollbar-width:thin;scrollbar-color:var(--purple) var(--border);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg2);border-radius:8px;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--primary),var(--purple));border-radius:8px;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
  min-height:100vh; color:var(--text);
  animation:fadeUp .4s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:860px;margin:0 auto;padding:16px;padding-bottom:40px;}

/* 顶部 */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 4px 8px;}
.logo{
  font-size:32px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(90deg,var(--primary),var(--purple),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.topbtns{display:flex;gap:10px;align-items:center;}
.topbtns button{
  padding:8px 16px;border:none;border-radius:20px;cursor:pointer;font-size:14px;font-weight:600;color:#fff;
  transition:transform .15s ease,box-shadow .25s ease;
}
.topbtns button:active{transform:scale(.96);}
.btn-login{background:linear-gradient(90deg,var(--primary),#6a96ff);box-shadow:0 4px 12px rgba(79,124,255,.35);}
.btn-admin{background:linear-gradient(90deg,var(--purple),var(--pink));box-shadow:0 4px 12px rgba(168,85,247,.35);}
.btn-logout{background:linear-gradient(90deg,#fb7185,#f43f5e);box-shadow:0 4px 12px rgba(244,63,94,.35);}
.topbtns button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 20px rgba(79,124,255,.35);}
.username{color:var(--purple);font-size:14px;font-weight:700;}

/* 公告 */
.announce{
  margin:14px 0;background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:14px 16px;box-shadow:var(--shadow);overflow:hidden;
}
.announce-title{font-size:14px;color:var(--orange);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.announce-title .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:blink 1.2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.announce-track{position:relative;height:24px;overflow:hidden;}
.announce-track .marquee{position:absolute;white-space:nowrap;font-size:15px;color:var(--text2);
  animation:marquee 22s linear infinite;}
@keyframes marquee{0%{transform:translateX(100%);}100%{transform:translateX(-100%);}}

/* 卡片 */
.cards{display:flex;flex-direction:column;gap:18px;margin-top:10px;}
.card{
  display:flex;align-items:center;gap:18px;padding:26px 24px;border-radius:20px;cursor:pointer;
  background:var(--card);border:2px solid var(--border);text-decoration:none;color:var(--text);
  box-shadow:var(--shadow);
  transition:transform .25s ease,box-shadow .25s ease;
}
.card:hover{transform:translateY(-4px) scale(1.02);}
.card .icon{font-size:44px;}
.card .info{flex:1;}
.card .info h2{font-size:22px;font-weight:700;margin-bottom:4px;}
.card .info p{font-size:14px;color:var(--text2);}
.card .arrow{font-size:22px;color:var(--text2);}
.card-cyan{border-color:var(--cyan);}
.card-cyan:hover{box-shadow:0 14px 34px rgba(6,182,212,.35);}
.card-pink{border-color:var(--pink);}
.card-pink:hover{box-shadow:0 14px 34px rgba(244,114,182,.35);}
.card-gray{border-color:var(--border);background:#f7f9ff;cursor:not-allowed;opacity:.7;}
.card-gray:hover{transform:none;box-shadow:var(--shadow);}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(30,40,80,.4);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:999;}
.modal-mask.show{display:flex;}
.modal-box{width:90%;max-width:340px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px 22px;position:relative;
  box-shadow:0 20px 50px rgba(79,124,255,.25);
  animation:modalIn .25s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.modal-out{animation:modalOut .2s ease forwards;}
@keyframes modalOut{from{opacity:1;transform:scale(1);}to{opacity:0;transform:scale(.92);}}
.modal-box h3{text-align:center;margin-bottom:18px;font-size:20px;color:var(--text);}
.close-x{position:absolute;top:10px;right:14px;font-size:22px;color:var(--text2);cursor:pointer;background:none;border:none;}
.close-x:hover{color:var(--purple);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;}
.field input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:#f7f9ff;color:var(--text);font-size:15px;outline:none;transition:border-color .2s;}
.field input:focus{border-color:var(--primary);}
.modal-btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;color:#fff;
  background:linear-gradient(90deg,var(--primary),var(--purple));box-shadow:0 6px 16px rgba(79,124,255,.3);
  transition:transform .15s ease;}
.modal-btn:active{transform:scale(.96);}
.err{color:#f43f5e;font-size:13px;text-align:center;margin-top:8px;min-height:18px;}
.switch{text-align:center;margin-top:14px;font-size:13px;color:var(--text2);}
.switch a{color:var(--primary);cursor:pointer;font-weight:600;}

/* 轻提示 toast */
.toast{position:fixed;left:50%;top:15%;transform:translateX(-50%) translateY(-10px);background:var(--card);color:var(--text);
  padding:12px 22px;border-radius:12px;box-shadow:0 10px 30px rgba(79,124,255,.3);font-size:15px;font-weight:600;z-index:2000;opacity:0;
  border:1px solid var(--border);transition:opacity .3s ease,transform .3s ease;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">工具箱</div>
    <div class="topbtns" id="topbtns">
      <button class="btn-login" id="btnLogin" onclick="showLogin()">登录</button>
      <button class="btn-admin" onclick="location.href='admin.html'">管理</button>
    </div>
  </div>

  <div class="announce">
    <div class="announce-title"><span class="dot"></span>📢 公告</div>
    <div class="announce-track"><span class="marquee" id="marquee">正在加载公告...</span></div>
  </div>

  <div class="cards">
    <a class="card card-cyan" href="download.html">
      <div class="icon">📦</div>
      <div class="info"><h2>网盘工具</h2><p>下载各类实用工具包</p></div>
      <div class="arrow">›</div>
    </a>
    <a class="card card-pink" href="music.html">
      <div class="icon">🎵</div>
      <div class="info"><h2>音乐播放器</h2><p>在线听歌 · 歌词 · 收藏</p></div>
      <div class="arrow">›</div>
    </a>
    <a class="card card-pink" href="favorites.html">
      <div class="icon">♡</div>
      <div class="info"><h2>我的收藏</h2><p>收藏夹 · 一键播放</p></div>
      <div class="arrow">›</div>
    </a>
    <div class="card card-gray">
      <div class="icon">⚙️</div>
      <div class="info"><h2>更多工具</h2><p>敬请期待</p></div>
      <div class="arrow">›</div>
    </div>
  </div>
</div>

<!-- 登录弹窗 -->
<div class="modal-mask" id="loginModal">
  <div class="modal-box" id="loginBox">
    <button class="close-x" id="closeLogin">✕</button>
    <h3>登录</h3>
    <div class="field"><label>用户名</label><input id="loginUser" placeholder="请输入用户名" autocomplete="off"></div>
    <div class="field"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码"></div>
    <div class="err" id="loginErr"></div>
    <button class="modal-btn" onclick="doLogin()">登 录</button>
    <div class="switch">没有账号？<a onclick="showReg()">立即注册</a></div>
  </div>
</div>

<!-- 注册弹窗 -->
<div class="modal-mask" id="regModal">
  <div class="modal-box" id="regBox">
    <button class="close-x" id="closeReg">✕</button>
    <h3>注册</h3>
    <div class="field"><label>用户名</label><input id="regUser" placeholder="请输入用户名"></div>
    <div class="field"><label>密码</label><input id="regPass" type="password" placeholder="请输入密码"></div>
    <div class="err" id="regErr"></div>
    <button class="modal-btn" onclick="doReg()">注 册</button>
    <div class="switch">已有账号？<a onclick="showLogin()">去登录</a></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='https://sb.lhb2009.cc.cd';

// 轻提示
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}

// 公告加载（保留全部历史，取最新几条滚动）
async function loadAnnouncements(){
  try{
    const r=await fetch(API+'/announcement');
    const data=await r.json();
    const list=(data&&data.data)||[];
    const marquee=document.getElementById('marquee');
    if(list.length){
      marquee.textContent=list.map(a=>{
        const t=a.title?('【'+a.title+'】'):'';
        return t+(a.content||'');
      }).join('　　·　　');
    } else {
      marquee.textContent='欢迎使用工具箱！';
    }
  }catch(e){
    document.getElementById('marquee').textContent='欢迎使用工具箱！';
  }
}

// 登录状态
function updateLoginUI(){
  const u=localStorage.getItem('lhb_user');
  const box=document.getElementById('topbtns');
  if(u){
    box.innerHTML=`<span class="username">${u}</span>
      <button class="btn-logout" onclick="logout()">退出</button>
      <button class="btn-admin" onclick="location.href='admin.html'">管理</button>`;
  } else {
    box.innerHTML=`<button class="btn-login" onclick="showLogin()">登录</button>
      <button class="btn-admin" onclick="location.href='admin.html'">管理</button>`;
  }
}
function logout(){ localStorage.removeItem('lhb_user'); updateLoginUI(); toast('已退出登录'); }

// 弹窗切换（带动画）
function hideModal(el){
  const box=el.querySelector('.modal-box');
  if(box) box.classList.add('modal-out');
  setTimeout(()=>{ el.classList.remove('show'); if(box) box.classList.remove('modal-out'); },180);
}
function showLogin(){ document.getElementById('regModal').classList.remove('show'); document.getElementById('loginModal').classList.add('show'); }
function showReg(){ document.getElementById('loginModal').classList.remove('show'); document.getElementById('regModal').classList.add('show'); }
document.getElementById('closeLogin').onclick=()=>hideModal(document.getElementById('loginModal'));
document.getElementById('closeReg').onclick=()=>hideModal(document.getElementById('regModal'));
document.getElementById('loginModal').addEventListener('click',e=>{ if(e.target.id==='loginModal')hideModal(e.target); });
document.getElementById('regModal').addEventListener('click',e=>{ if(e.target.id==='regModal')hideModal(e.target); });

async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  if(!u||!p){ err.textContent='请填写用户名和密码'; return; }
  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const data=await r.json();
    if(data&&data.code===0){
      localStorage.setItem('lhb_user',u);
      err.textContent='';
      hideModal(document.getElementById('loginModal'));
      updateLoginUI();
      toast('登录成功，欢迎 '+u+'！');
    } else {
      err.textContent=(data&&data.msg)||'用户名或密码错误';
    }
  }catch(e){ err.textContent='网络错误，请重试'; }
}
document.getElementById('loginPass').addEventListener('keydown',e=>{ if(e.key==='Enter')doLogin(); });

async function doReg(){
  const u=document.getElementById('regUser').value.trim();
  const p=document.getElementById('regPass').value;
  const err=document.getElementById('regErr');
  if(!u||!p){ err.textContent='请填写用户名和密码'; return; }
  try{
    const r=await fetch(API+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const data=await r.json();
    if(data&&data.code===0){
      localStorage.setItem('lhb_user',u);
      err.textContent='';
      hideModal(document.getElementById('regModal'));
      updateLoginUI();
      toast('注册成功，已自动登录！');
    } else {
      err.textContent=(data&&data.msg)||'注册失败';
    }
  }catch(e){ err.textContent='网络错误，请重试'; }
}

updateLoginUI();
loadAnnouncements();
</script>
</body>
</html>
