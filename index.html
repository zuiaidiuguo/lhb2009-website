<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LHB 工具箱</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 480px;
    text-align: center;
}

h1 {
    color: #fff;
    font-size: 2.2rem;
    font-weight: 600;
    margin-bottom: 20px;
    letter-spacing: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
}

/* 公告栏 */
.announcement-bar {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 28px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
}

.announcement-bar .tag {
    flex-shrink: 0;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: #fff;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    letter-spacing: 1px;
}

.announcement-bar .content {
    color: #333;
    font-size: 0.95rem;
    line-height: 1.5;
    word-break: break-word;
}

.announcement-bar .content.empty {
    color: #999;
}

/* 管理后台 */
.admin-panel {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 28px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    text-align: left;
}

.admin-panel h2 {
    color: #333;
    font-size: 1.1rem;
    margin-bottom: 14px;
}

.admin-panel textarea {
    width: 100%;
    min-height: 90px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
    margin-bottom: 12px;
}

.admin-panel textarea:focus {
    outline: none;
    border-color: #667eea;
}

.admin-panel .actions {
    display: flex;
    gap: 10px;
}

/* 卡片 */
.cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
}

.card {
    width: 100%;
    height: 70px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 500;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
}

.card.active {
    background: rgba(255, 255, 255, 0.95);
    color: #333;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}

.card.active:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}

.card.disabled {
    background: rgba(255, 255, 255, 0.25);
    color: rgba(255, 255, 255, 0.5);
    cursor: not-allowed;
    box-shadow: none;
}

.card .icon {
    font-size: 1.6rem;
}

.card.disabled .icon,
.card.disabled .label {
    filter: grayscale(1);
    opacity: 0.7;
}

/* 按钮 */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
}

.btn-primary:hover { transform: translateY(-2px); }

.btn-danger {
    background: #f5576c;
    color: #fff;
}

.btn-danger:hover { transform: translateY(-2px); }

.btn-ghost {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
}

.btn-ghost:hover { background: rgba(255, 255, 255, 0.35); }

.btn-small {
    padding: 8px 16px;
    font-size: 0.85rem;
}

/* 弹窗 */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.show { display: flex; }

.modal {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
}

.modal h3 {
    color: #333;
    font-size: 1.15rem;
    margin-bottom: 18px;
}

.modal input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    margin-bottom: 16px;
    text-align: center;
}

.modal input[type="password"]:focus {
    outline: none;
    border-color: #667eea;
}

.modal .modal-actions {
    display: flex;
    gap: 10px;
}

.modal .modal-actions .btn { flex: 1; }

.modal .error-msg {
    color: #f5576c;
    font-size: 0.85rem;
    margin-bottom: 12px;
    min-height: 18px;
}

/* 提示 toast */
.toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 0.9rem;
    z-index: 2000;
    transition: transform 0.3s ease;
    pointer-events: none;
}

.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 480px) {
    h1 { font-size: 1.8rem; }
}
</style>
</head>
<body>

<div class="container">
    <h1>我的工具箱</h1>

    <!-- 公告栏 -->
    <div class="announcement-bar">
        <span class="tag">公告</span>
        <span class="content empty" id="announcementContent">暂无公告</span>
    </div>

    <!-- 管理后台（登录后显示） -->
    <div class="admin-panel" id="adminPanel" style="display:none;">
        <h2>📢 公告管理</h2>
        <textarea id="announcementInput" placeholder="请输入公告内容..."></textarea>
        <div class="actions">
            <button class="btn btn-primary" onclick="publishAnnouncement()">发布公告</button>
            <button class="btn btn-danger" onclick="logout()">退出登录</button>
        </div>
    </div>

    <!-- 功能卡片 -->
    <div class="cards">
        <a href="download.html" class="card active">
            <span class="icon">📦</span>
            <span class="label">网盘工具</span>
        </a>
        <div class="card disabled" onclick="return false;">
            <span class="icon">🎵</span>
            <span class="label">音乐播放器</span>
        </div>
        <div class="card disabled" onclick="return false;">
            <span class="icon">⚙️</span>
            <span class="label">其他工具</span>
        </div>
    </div>

    <!-- 管理员登录按钮 -->
    <button class="btn btn-ghost" onclick="showLoginModal()" id="loginBtn">管理员登录</button>
</div>

<!-- 登录弹窗 -->
<div class="modal-overlay" id="loginModal">
    <div class="modal">
        <h3>管理员登录</h3>
        <div class="error-msg" id="loginError"></div>
        <input type="password" id="passwordInput" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
        <div class="modal-actions">
            <button class="btn btn-primary" onclick="doLogin()">确认</button>
            <button class="btn btn-ghost" style="background:#eee;color:#333;" onclick="closeLoginModal()">取消</button>
        </div>
    </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<script>
// ============ 状态 ============
let isAdmin = false;
let adminPassword = '';

// ============ 公告获取 ============
async function fetchAnnouncement() {
    try {
        const res = await fetch('https://sb.lhb2009.cc.cd/announcement');
        const data = await res.json();
        const el = document.getElementById('announcementContent');
        if (data.announcement && data.announcement.trim()) {
            el.textContent = data.announcement;
            el.classList.remove('empty');
        } else {
            el.textContent = '暂无公告';
            el.classList.add('empty');
        }
    } catch (e) {
        document.getElementById('announcementContent').textContent = '暂无公告';
    }
}

// ============ 登录弹窗 ============
function showLoginModal() {
    document.getElementById('loginError').textContent = '';
    document.getElementById('passwordInput').value = '';
    document.getElementById('loginModal').classList.add('show');
    setTimeout(() => document.getElementById('passwordInput').focus(), 100);
}

function closeLoginModal() {
    document.getElementById('loginModal').classList.remove('show');
}

async function doLogin() {
    const password = document.getElementById('passwordInput').value.trim();
    if (!password) {
        document.getElementById('loginError').textContent = '请输入密码';
        return;
    }
    try {
        const res = await fetch('https://sb.lhb2009.cc.cd/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.success) {
            isAdmin = true;
            adminPassword = password;
            closeLoginModal();
            showAdminPanel();
            showToast('登录成功');
        } else {
            document.getElementById('loginError').textContent = '密码错误';
        }
    } catch (e) {
        document.getElementById('loginError').textContent = '网络错误，请重试';
    }
}

// ============ 管理后台 ============
function showAdminPanel() {
    document.getElementById('adminPanel').style.display = 'block';
    document.getElementById('loginBtn').style.display = 'none';
    // 预填当前公告
    const cur = document.getElementById('announcementContent').textContent;
    if (cur !== '暂无公告') {
        document.getElementById('announcementInput').value = cur;
    }
}

function logout() {
    isAdmin = false;
    adminPassword = '';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('loginBtn').style.display = '';
    showToast('已退出登录');
}

async function publishAnnouncement() {
    const content = document.getElementById('announcementInput').value.trim();
    if (!content) {
        showToast('公告内容不能为空');
        return;
    }
    try {
        const res = await fetch('https://sb.lhb2009.cc.cd/announcement', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Admin-Password': adminPassword
            },
            body: JSON.stringify({ announcement: content })
        });
        const data = await res.json();
        if (data.success) {
            showToast('公告发布成功');
            fetchAnnouncement();
        } else {
            showToast('发布失败：' + (data.error || '未知错误'));
            if (data.error === '未授权') {
                logout();
            }
        }
    } catch (e) {
        showToast('网络错误，请重试');
    }
}

// ============ Toast ============
let toastTimer;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ============ 初始化 ============
fetchAnnouncement();
</script>

</body>
</html>
