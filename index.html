<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LHB 工具箱</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
  background-attachment: fixed;
  min-height: 100vh;
  color: #e8e8f0;
}
.container { max-width: 900px; margin: 0 auto; padding: 16px; }

/* 顶部 */
.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 4px 16px;
}
.header h1 {
  font-size: 26px; font-weight: 700;
  background: linear-gradient(90deg, #7c8cff, #a78bfa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header-btns { display: flex; gap: 10px; }
.header-btns button {
  padding: 8px 18px; border-radius: 20px; border: none; cursor: pointer;
  font-size: 14px; font-weight: 600; transition: all .2s;
}
.btn-login { background: rgba(255,255,255,.1); color: #e8e8f0; }
.btn-login:hover { background: rgba(255,255,255,.2); }
.btn-admin { background: linear-gradient(135deg, #7c8cff, #a78bfa); color: #fff; }
.btn-admin:hover { filter: brightness(1.1); }

/* 功能卡片 */
.card-list { display: flex; flex-direction: column; gap: 18px; padding-top: 8px; }
.func-card {
  display: flex; align-items: center; gap: 20px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px; padding: 32px 28px; cursor: pointer;
  transition: all .25s; width: 100%;
}
.func-card:hover { background: rgba(255,255,255,.1); transform: translateY(-2px); }
.func-card .icon { font-size: 44px; }
.func-card .info { flex: 1; }
.func-card .info h2 { font-size: 22px; margin-bottom: 6px; }
.func-card .info p { font-size: 14px; color: rgba(232,232,240,.6); }
.func-card .arrow { font-size: 24px; color: rgba(232,232,240,.4); }
.func-card.disabled { opacity: .5; cursor: not-allowed; }
.func-card.disabled:hover { transform: none; background: rgba(255,255,255,.06); }

/* 模态框 */
.modal {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 16px;
}
.modal.show { display: flex; }
.modal-box {
  background: #1a1a2e; border: 1px solid rgba(255,255,255,.1);
  border-radius: 18px; width: 100%; max-width: 420px;
  max-height: 85vh; overflow-y: auto; padding: 24px;
}
.modal-box h3 { font-size: 18px; margin-bottom: 18px; }
.modal-close {
  float: right; background: none; border: none; color: rgba(255,255,255,.5);
  font-size: 22px; cursor: pointer;
}

/* 标签页 */
.tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.tab-btn {
  padding: 8px 14px; border-radius: 16px; border: none; cursor: pointer;
  background: rgba(255,255,255,.08); color: #e8e8f0; font-size: 13px;
  transition: all .2s;
}
.tab-btn.active { background: linear-gradient(135deg, #7c8cff, #a78bfa); color:#fff; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* 表单 */
input[type="text"], input[type="password"] {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.06); color: #e8e8f0; font-size: 14px; margin-bottom: 12px; outline: none;
}
input:focus { border-color: #7c8cff; }
textarea {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.06); color: #e8e8f0; font-size: 14px; margin-bottom: 12px; outline: none;
  resize: vertical; min-height: 80px; font-family: inherit;
}
textarea:focus { border-color: #7c8cff; }
.btn-primary {
  width: 100%; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
  background: linear-gradient(135deg, #7c8cff, #a78bfa); color: #fff;
  font-size: 15px; font-weight: 600; transition: all .2s;
}
.btn-primary:hover { filter: brightness(1.1); }
.btn-danger { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
.btn-small {
  padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer;
  background: rgba(255,255,255,.1); color: #e8e8f0; font-size: 12px; margin: 2px;
}
.btn-small.danger { background: rgba(255,80,80,.2); color:#ff8a8a; }

/* 列表项 */
.list-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 6px; border-bottom: 1px solid rgba(255,255,255,.06);
}
.list-item .info { flex: 1; }
.list-item .info .name { font-size: 14px; }
.list-item .info .sub { font-size: 12px; color: rgba(232,232,240,.5); }
.msg { font-size: 13px; margin-top: 10px; padding: 8px; border-radius: 8px; display:none; }
.msg.ok { display:block; background: rgba(80,200,120,.15); color:#7edba0; }
.msg.err { display:block; background: rgba(255,80,80,.15); color:#ff8a8a; }

/* 登录态提示 */
#userBadge { font-size: 13px; color: rgba(232,232,240,.7); margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>LHB 工具箱</h1>
    <div class="header-btns">
      <button class="btn-login" onclick="openLogin()">登录</button>
      <button class="btn-admin" onclick="openAdmin()">管理</button>
    </div>
  </div>
  <div id="userBadge"></div>

  <div class="card-list">
    <div class="func-card" onclick="location.href='download.html'">
      <div class="icon">📦</div>
      <div class="info">
        <h2>网盘工具</h2>
        <p>下载各类工具包</p>
      </div>
      <div class="arrow">›</div>
    </div>

    <div class="func-card" onclick="location.href='music.html'">
      <div class="icon">🎵</div>
      <div class="info">
        <h2>音乐播放器</h2>
        <p>在线听歌，收藏与播放</p>
      </div>
      <div class="arrow">›</div>
    </div>

    <div class="func-card disabled">
      <div class="icon">🧰</div>
      <div class="info">
        <h2>更多工具</h2>
        <p>敬请期待</p>
      </div>
      <div class="arrow">›</div>
    </div>
  </div>
</div>

<!-- 登录模态框 -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('loginModal')">&times;</button>
    <h3>用户登录</h3>
    <input type="text" id="loginUser" placeholder="用户名">
    <input type="password" id="loginPass" placeholder="密码">
    <button class="btn-primary" onclick="doLogin()">登录</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<!-- 管理模态框 -->
<div class="modal" id="adminModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('adminModal')">&times;</button>
    <h3>管理后台</h3>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('tab-announce',this)">📢 发布公告</button>
      <button class="tab-btn" onclick="switchTab('tab-register',this)">👤 注册用户</button>
      <button class="tab-btn" onclick="switchTab('tab-users',this)">👥 用户列表</button>
      <button class="tab-btn" onclick="switchTab('tab-requests',this)">🎵 歌曲请求</button>
    </div>

    <!-- 发布公告 -->
    <div class="tab-panel active" id="tab-announce">
      <input type="password" id="adminPass" placeholder="管理员密码">
      <input type="text" id="annTitle" placeholder="公告标题">
      <textarea id="annContent" placeholder="公告内容"></textarea>
      <button class="btn-primary" onclick="publishAnnounce()">发布</button>
      <div class="msg" id="annMsg"></div>
    </div>

    <!-- 注册用户 -->
    <div class="tab-panel" id="tab-register">
      <input type="password" id="adminPass2" placeholder="管理员密码">
      <input type="text" id="regUser" placeholder="用户名">
      <input type="password" id="regPass" placeholder="密码">
      <button class="btn-primary" onclick="registerUser()">注册</button>
      <div class="msg" id="regMsg"></div>
    </div>

    <!-- 用户列表 -->
    <div class="tab-panel" id="tab-users">
      <input type="password" id="adminPass3" placeholder="管理员密码">
      <button class="btn-primary" style="margin-bottom:12px" onclick="loadUsers()">加载用户列表</button>
      <div id="userList"></div>
      <div class="msg" id="usersMsg"></div>
    </div>

    <!-- 歌曲请求 -->
    <div class="tab-panel" id="tab-requests">
      <input type="password" id="adminPass4" placeholder="管理员密码">
      <button class="btn-primary" style="margin-bottom:12px" onclick="loadRequests()">加载歌曲请求</button>
      <div id="reqList"></div>
      <div class="msg" id="reqMsg"></div>
    </div>
  </div>
</div>

<script>
const API = 'https://sb.lhb2009.cc.cd';
let currentUser = null;

// 检查登录态
function checkLogin() {
  const u = localStorage.getItem('lhb_user');
  if (u) {
    currentUser = JSON.parse(u);
    const badge = document.getElementById('userBadge');
    badge.textContent = '已登录：' + currentUser.username;
  }
}

function openLogin() { showModal('loginModal'); }
function openAdmin() { showModal('adminModal'); }

function showModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function switchTab(panel, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(panel).classList.add('active');
  btn.classList.add('active');
}

// 用户登录
async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const msg = document.getElementById('loginMsg');
  if (!u || !p) { msg.className='msg err'; msg.textContent='请输入用户名和密码'; return; }
  try {
    const res = await fetch(`${API}/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:u, password:p})
    });
    const data = await res.json();
    if (data.success) {
      currentUser = {username:u};
      localStorage.setItem('lhb_user', JSON.stringify(currentUser));
      document.getElementById('userBadge').textContent = '已登录：' + u;
      msg.className='msg ok'; msg.textContent='登录成功';
      setTimeout(()=>closeModal('loginModal'), 600);
    } else {
      msg.className='msg err'; msg.textContent = data.message || '登录失败';
    }
  } catch(e) {
    msg.className='msg err'; msg.textContent='网络错误：' + e.message;
  }
}

// 发布公告
async function publishAnnounce() {
  const pass = document.getElementById('adminPass').value;
  const title = document.getElementById('annTitle').value.trim();
  const content = document.getElementById('annContent').value.trim();
  const msg = document.getElementById('annMsg');
  if (!pass || !title || !content) { msg.className='msg err'; msg.textContent='请填写完整信息'; return; }
  try {
    const res = await fetch(`${API}/announce`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password:pass, title, content})
    });
    const data = await res.json();
    if (data.success) {
      msg.className='msg ok'; msg.textContent='公告发布成功';
      document.getElementById('annTitle').value=''; document.getElementById('annContent').value='';
    } else {
      msg.className='msg err'; msg.textContent = data.message || '发布失败';
    }
  } catch(e) { msg.className='msg err'; msg.textContent='网络错误：' + e.message; }
}

// 注册用户
async function registerUser() {
  const pass = document.getElementById('adminPass2').value;
  const u = document.getElementById('regUser').value.trim();
  const p = document.getElementById('regPass').value;
  const msg = document.getElementById('regMsg');
  if (!pass || !u || !p) { msg.className='msg err'; msg.textContent='请填写完整信息'; return; }
  try {
    const res = await fetch(`${API}/register`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password:pass, username:u, password2:p})
    });
    const data = await res.json();
    if (data.success) {
      msg.className='msg ok'; msg.textContent='用户注册成功';
      document.getElementById('regUser').value=''; document.getElementById('regPass').value='';
    } else {
      msg.className='msg err'; msg.textContent = data.message || '注册失败';
    }
  } catch(e) { msg.className='msg err'; msg.textContent='网络错误：' + e.message; }
}

// 加载用户列表
async function loadUsers() {
  const pass = document.getElementById('adminPass3').value;
  const msg = document.getElementById('usersMsg');
  if (!pass) { msg.className='msg err'; msg.textContent='请输入管理员密码'; return; }
  try {
    const res = await fetch(`${API}/users?password=${encodeURIComponent(pass)}`);
    const data = await res.json();
    if (data.success) {
      const list = document.getElementById('userList');
      list.innerHTML = '';
      (data.users||[]).forEach(u => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div class="info">
            <div class="name">${u.username}</div>
            <div class="sub">${u.created_at||''}</div>
          </div>
          <div>
            <button class="btn-small" onclick="editUser('${u.username}')">编辑</button>
            <button class="btn-small danger" onclick="delUser('${u.username}')">删除</button>
          </div>`;
        list.appendChild(div);
      });
      msg.className='msg ok'; msg.textContent='加载成功';
    } else {
      msg.className='msg err'; msg.textContent = data.message || '加载失败';
    }
  } catch(e) { msg.className='msg err'; msg.textContent='网络错误：' + e.message; }
}

async function editUser(username) {
  const newPass = prompt(`编辑用户 ${username} 的新密码：`);
  if (!newPass) return;
  const pass = document.getElementById('adminPass3').value;
  try {
    const res = await fetch(`${API}/users/${username}`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password:pass, newPassword:newPass})
    });
    const data = await res.json();
    const msg = document.getElementById('usersMsg');
    if (data.success) { msg.className='msg ok'; msg.textContent='修改成功'; loadUsers(); }
    else { msg.className='msg err'; msg.textContent = data.message||'修改失败'; }
  } catch(e) { msg.className='msg err'; msg.textContent='网络错误'; }
}

async function delUser(username) {
  if (!confirm(`确定删除用户 ${username}？`)) return;
  const pass = document.getElementById('adminPass3').value;
  try {
    const res = await fetch(`${API}/users/${username}`, {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password:pass})
    });
    const data = await res.json();
    const msg = document.getElementById('usersMsg');
    if (data.success) { msg.className='msg ok'; msg.textContent='删除成功'; loadUsers(); }
    else { msg.className='msg err'; msg.textContent = data.message||'删除失败'; }
  } catch(e) { msg.className='msg err'; msg.textContent='网络错误'; }
}

// 加载歌曲请求
async function loadRequests() {
  const pass = document.getElementById('adminPass4').value;
  const msg = document.getElementById('reqMsg');
  if (!pass) { msg.className='msg err'; msg.textContent='请输入管理员密码'; return; }
  try {
    const res = await fetch(`${API}/requests?password=${encodeURIComponent(pass)}`);
    const data = await res.json();
    if (data.success) {
      const list = document.getElementById('reqList');
      list.innerHTML = '';
      (data.requests||[]).forEach(r => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div class="info">
            <div class="name">${r.song}</div>
            <div class="sub">由 ${r.username} 提交</div>
          </div>
          <button class="btn-small danger" onclick="delRequest(${r.id})">删除</button>`;
        list.appendChild(div);
      });
      msg.className='msg ok'; msg.textContent='加载成功';
    } else {
      msg.className='msg err'; msg.textContent = data.message || '加载失败';
    }
  } catch(e) { msg.className='msg err'; msg.textContent='网络错误：' + e.message; }
}

async function delRequest(id) {
  const pass = document.getElementById('adminPass4').value;
  try {
    const res = await fetch(`${API}/requests/${id}`, {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password:pass})
    });
    const data = await res.json();
    const msg = document.getElementById('reqMsg');
    if (data.success) { msg.className='msg ok'; msg.textContent='删除成功'; loadRequests(); }
    else { msg.className='msg err'; msg.textContent = data.message||'删除失败'; }
  } catch(e) { msg.className='msg err'; msg.textContent='网络错误'; }
}

// 关闭弹窗按钮
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal').forEach(m => m.classList.remove('show')); });

checkLogin();
</script>
</body>
</html>
