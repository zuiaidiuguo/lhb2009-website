<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>音乐播放器 - 工具箱</title>
<style>
:root{
  --bg1:#f0f4ff; --bg2:#e8f0fe; --bg3:#f5f0ff;
  --card:#ffffff;
  --primary:#4f7cff;
  --purple:#a855f7; --pink:#f472b6; --cyan:#06b6d4; --orange:#fb923c;
  --text:#1a1a2e; --text2:#4a4a6a;
  --border:#e8ecf4;
  --shadow:0 8px 24px rgba(79,124,255,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{scrollbar-width:thin;scrollbar-color:var(--pink) var(--border);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg2);border-radius:8px;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--pink),var(--purple));border-radius:8px;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
  min-height:100vh; color:var(--text);
  animation:fadeUp .4s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:860px;margin:0 auto;padding:16px;padding-bottom:110px;}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 4px 18px;}
.back{font-size:30px;color:var(--pink);cursor:pointer;text-decoration:none;font-weight:700;}
.title{font-size:24px;font-weight:800;flex:1;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.topbtns{display:flex;gap:8px;}
.topbtns button{padding:7px 14px;border-radius:18px;border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  background:linear-gradient(90deg,var(--pink),var(--purple));box-shadow:0 4px 12px rgba(244,114,182,.3);
  transition:transform .15s ease;}
.topbtns button:active{transform:scale(.96);}

/* 搜索 */
.search{margin-bottom:16px;}
.search input{width:100%;padding:12px 18px;border-radius:24px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;outline:none;box-shadow:var(--shadow);transition:border-color .2s;}
.search input:focus{border-color:var(--pink);}

/* 歌曲列表 */
.songlist{display:flex;flex-direction:column;gap:10px;}
.song{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;cursor:pointer;
  background:var(--card);border:1px solid var(--border);border-left:4px solid;box-shadow:var(--shadow);
  transition:transform .25s ease,box-shadow .25s ease;
}
.song:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 10px 24px rgba(244,114,182,.22);}
.song.playing{background:linear-gradient(90deg,#eef2ff,#fdf0ff);border-color:var(--pink);}
.song .idx{width:26px;text-align:center;color:var(--text2);font-size:13px;}
.song .nm{flex:1;}
.song .nm .t{font-size:16px;font-weight:600;color:var(--text);}
.song .nm .a{font-size:12px;color:var(--text2);}
.song .fav{font-size:20px;cursor:pointer;transition:transform .2s;}
.song .fav:active{transform:scale(.8);}
.song .eq{display:none;font-size:14px;color:var(--pink);}
.song.playing .eq{display:block;}
.song.playing .idx{display:none;}
.c0{border-left-color:var(--pink);} .c1{border-left-color:var(--purple);} .c2{border-left-color:var(--cyan);} .c3{border-left-color:var(--orange);}
.c4{border-left-color:#34d399;} .c5{border-left-color:#fbbf24;} .c6{border-left-color:var(--primary);} .c7{border-left-color:#f43f5e;}

/* 悬浮详情窗 */
.float-detail{
  position:fixed; z-index:80; width:min(400px,94vw); border-radius:20px;
  background:var(--card);border:1px solid var(--border);box-shadow:0 20px 50px rgba(79,124,255,.28);
  overflow:hidden; display:none;
  animation:modalIn .25s ease;
}
.float-detail.show{display:block;}
@keyframes modalIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
.fd-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(90deg,#eef2ff,#fdf0ff);border-bottom:1px solid var(--border);}
.fd-back{font-size:24px;color:var(--pink);cursor:pointer;font-weight:700;}
.fd-title{font-size:17px;font-weight:800;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fd-body{padding:14px 16px 18px;}
.now-name{font-size:22px;font-weight:800;text-align:center;margin:4px 0 4px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.now-artist{text-align:center;color:var(--text2);font-size:13px;margin-bottom:12px;}
.fav-btn{display:inline-flex;align-items:center;gap:4px;margin:0 auto 10px;padding:6px 16px;border-radius:20px;border:1px solid var(--pink);color:var(--pink);font-size:14px;font-weight:600;cursor:pointer;background:#fff;transition:all .2s;}
.fav-btn.active{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;border-color:transparent;}

/* 歌词 */
.lyrics{height:150px;overflow-y:auto;text-align:center;padding:8px 0;margin-bottom:12px;border:1px solid var(--border);border-radius:12px;background:#fafbff;}
.lyrics .ly{padding:5px 0;color:var(--text2);font-size:14px;transition:all .2s;}
.lyrics .ly.active{color:var(--purple);font-size:16px;font-weight:700;}
.no-lrc{text-align:center;color:var(--text2);padding:40px 0;font-size:14px;}
.no-lrc .req{display:inline-block;margin-top:10px;padding:7px 18px;border-radius:18px;border:none;color:#fff;font-size:13px;cursor:pointer;
  background:linear-gradient(90deg,var(--primary),var(--purple));}

/* 进度条 */
.progress{position:relative;height:6px;border-radius:3px;background:var(--border);cursor:pointer;margin-bottom:10px;}
.progress .fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--pink),var(--purple));}
.progress .knob{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--purple);box-shadow:0 0 8px rgba(168,85,247,.6);}
.time-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:8px;}

/* 控制栏 */
.ctrl{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;}
.ctrl button{background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;padding:0 10px;transition:transform .15s;}
.ctrl button:active{transform:scale(.9);}
.ctrl .big{font-size:44px;color:var(--purple);}

/* 工具栏 */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}
.chip{padding:6px 12px;border-radius:16px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text2);transition:all .2s;}
.chip.active{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;border-color:transparent;}
.mode-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--purple);color:var(--purple);background:#fff;transition:all .2s;}
.mode-chip:active{transform:scale(.95);}

/* 迷你悬浮球 */
.float{
  position:fixed;right:14px;bottom:90px;width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink),var(--purple));display:none;align-items:center;justify-content:center;
  box-shadow:0 6px 22px rgba(168,85,247,.5);z-index:70;cursor:pointer;color:#fff;text-align:center;
}
.float.show{display:flex;}
.float .f-name{font-size:10px;font-weight:700;max-width:50px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.float .f-close{position:absolute;top:-4px;right:-4px;font-size:14px;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;cursor:pointer;z-index:2;}
.float .f-play{font-size:20px;}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(30,40,80,.4);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;}
.modal-mask.show{display:flex;}
.modal-box{width:90%;max-width:340px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px 22px;position:relative;
  box-shadow:0 20px 50px rgba(79,124,255,.25);animation:modalIn .25s ease;}
.modal-out{animation:modalOut .2s ease forwards;}
@keyframes modalOut{from{opacity:1;transform:scale(1);}to{opacity:0;transform:scale(.92);}}
.modal-box h3{text-align:center;margin-bottom:18px;font-size:20px;color:var(--text);}
.close-x{position:absolute;top:10px;right:14px;font-size:22px;color:var(--text2);cursor:pointer;background:none;border:none;}
.close-x:hover{color:var(--purple);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;}
.field input,.field textarea{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:#f7f9ff;color:var(--text);font-size:15px;outline:none;transition:border-color .2s;}
.field textarea{resize:none;min-height:70px;}
.field input:focus,.field textarea:focus{border-color:var(--pink);}
.modal-btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;color:#fff;
  background:linear-gradient(90deg,var(--primary),var(--purple));box-shadow:0 6px 16px rgba(79,124,255,.3);
  transition:transform .15s ease;}
.modal-btn:active{transform:scale(.96);}
.err{color:#f43f5e;font-size:13px;text-align:center;margin-top:8px;min-height:18px;}
.switch{text-align:center;margin-top:14px;font-size:13px;color:var(--text2);}
.switch a{color:var(--primary);cursor:pointer;font-weight:600;}

/* 轻提示 */
.toast{position:fixed;left:50%;top:15%;transform:translateX(-50%) translateY(-10px);background:var(--card);color:var(--text);
  padding:12px 22px;border-radius:12px;box-shadow:0 10px 30px rgba(79,124,255,.3);font-size:15px;font-weight:600;z-index:2000;opacity:0;
  border:1px solid var(--border);transition:opacity .3s ease,transform .3s ease;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 手机适配：详情悬浮窗居中偏下 */
@media (max-width:600px){
  .float-detail{left:50%!important;right:auto!important;top:auto!important;bottom:10px!important;transform:translateX(-50%);}
  .float-detail.show{animation:modalInUp .25s ease;}
  @keyframes modalInUp{from{opacity:0;transform:translateX(-50%) translateY(20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html" id="backLink">‹</a>
    <span class="title">🎵 音乐播放器</span>
    <div class="topbtns">
      <button onclick="openFav()">♡ 收藏</button>
      <button onclick="openRequest()">📝 求歌</button>
    </div>
  </div>
  <div class="search"><input id="search" placeholder="搜索歌曲..."></div>
  <div class="songlist" id="songlist"></div>
</div>

<!-- 悬浮详情窗 -->
<div class="float-detail" id="detail">
  <div class="fd-head">
    <span class="fd-back" onclick="closeDetail()">‹</span>
    <span class="fd-title" id="detailTitle">正在播放</span>
  </div>
  <div class="fd-body">
    <div class="now-name" id="nowName">未播放</div>
    <div class="now-artist" id="nowArtist">LHB 工具箱</div>
    <div style="text-align:center;">
      <span class="fav-btn" id="detailFav" onclick="toggleFavDetail()">♡ 收藏</span>
    </div>
    <div class="lyrics" id="lyrics"><div class="no-lrc">暂无歌词</div></div>
    <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    <div class="progress" id="progress">
      <div class="fill" id="progFill"></div>
      <div class="knob" id="progKnob"></div>
    </div>
    <div class="toolbar" id="speedBar">
      <span class="chip" data-s="0.5">0.5x</span>
      <span class="chip" data-s="0.75">0.75x</span>
      <span class="chip active" data-s="1">1x</span>
      <span class="chip" data-s="1.25">1.25x</span>
      <span class="chip" data-s="1.5">1.5x</span>
      <span class="chip" data-s="2">2x</span>
    </div>
    <div style="text-align:center;margin-bottom:8px;">
      <span class="mode-chip" id="modeChip" onclick="cycleMode()">🔂 列表循环</span>
    </div>
    <div class="ctrl">
      <button onclick="prev()">⏮</button>
      <button class="big" id="playBtn" onclick="toggle()">▶</button>
      <button onclick="next()">⏭</button>
    </div>
  </div>
</div>

<!-- 迷你悬浮球 -->
<div class="float" id="floatW">
  <span class="f-close" onclick="closeFloat(event)">✕</span>
  <div class="f-name" id="fName">未播放</div>
  <div class="f-play" id="fPlay" onclick="toggle(event)">▶</div>
</div>

<!-- 登录弹窗 -->
<div class="modal-mask" id="loginModal">
  <div class="modal-box">
    <button class="close-x" id="closeLogin">✕</button>
    <h3>登录</h3>
    <div class="field"><label>用户名</label><input id="loginUser" placeholder="请输入用户名"></div>
    <div class="field"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码"></div>
    <div class="err" id="loginErr"></div>
    <button class="modal-btn" onclick="doLogin()">登 录</button>
    <div class="switch">没有账号？<a onclick="showReg()">立即注册</a></div>
  </div>
</div>

<!-- 注册弹窗 -->
<div class="modal-mask" id="regModal">
  <div class="modal-box">
    <button class="close-x" id="closeReg">✕</button>
    <h3>注册</h3>
    <div class="field"><label>用户名</label><input id="regUser" placeholder="请输入用户名"></div>
    <div class="field"><label>密码</label><input id="regPass" type="password" placeholder="请输入密码"></div>
    <div class="err" id="regErr"></div>
    <button class="modal-btn" onclick="doReg()">注 册</button>
    <div class="switch">已有账号？<a onclick="showLogin()">去登录</a></div>
  </div>
</div>

<!-- 求歌弹窗 -->
<div class="modal-mask" id="reqModal">
  <div class="modal-box">
    <button class="close-x" id="closeReq">✕</button>
    <h3>求歌</h3>
    <div class="field"><label>歌曲名</label><input id="reqName" placeholder="请输入想听的歌"></div>
    <div class="field"><label>备注</label><textarea id="reqNote" placeholder="歌手 / 版本等（选填）"></textarea></div>
    <div class="err" id="reqErr"></div>
    <button class="modal-btn" onclick="submitReq()">提交请求</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const API='https://sb.lhb2009.cc.cd';
const CDN='https://cdn.jsdelivr.net/gh/zuiaidiuguo/lhb2009-website@master/music/';
const FAV_KEY='lhb_fav_';
const LAST_REQ_KEY='lhb_req_time_';

const SONGS=[
  '爱错','爱情讯息','稻香','告白气球','红色高跟鞋','花海','鹿 be free','青花瓷','兰亭序','你从未离去','清空','晴天','我乘着风飞过来','心之火（DJ版）','最后一页','第57次取消发送',
  'All For Love','All My People','Counting Stars','Edge Of My Life','Fever Pitch-Richz','Good Time','Monsters','Nevada','Power','Remember Our Summer','Sold Out','Teeth','That Girl','The King','This Is It','Unstoppable','Wake'
].map((n,i)=>({name:n,url:CDN+encodeURIComponent(n)+'.mp3',lrc:CDN+encodeURIComponent(n)+'.lrc'}));

let current=-1, favs=[], queue=[], mode='list', speed=1;
let userInteracting=false, resetTimer=null;

const audio=new Audio();
audio.preload='auto';

// 轻提示
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}

function getFavKey(){ const u=localStorage.getItem('lhb_user'); return FAV_KEY+(u||'guest'); }
function loadFavs(){ try{ favs=JSON.parse(localStorage.getItem(getFavKey())||'[]'); }catch(e){ favs=[]; } }
function saveFavs(){ localStorage.setItem(getFavKey(),JSON.stringify(favs)); }

// 渲染列表
const listEl=document.getElementById('songlist');
function renderList(filter){
  listEl.innerHTML='';
  const kw=(filter||'').toLowerCase();
  let shown=0;
  SONGS.forEach((s,i)=>{
    if(kw && !s.name.toLowerCase().includes(kw)) return;
    const d=document.createElement('div');
    d.className='song c'+(i%8)+((i===current)?' playing':'');
    d.style.animation='itemIn .3s ease '+(shown*0.05)+'s both';
    shown++;
    const isFav=favs.includes(s.name);
    d.innerHTML=`<span class="idx">${i+1}</span><span class="eq">♪</span>
      <span class="nm"><div class="t">${s.name}</div><div class="a">${i<16?'中文':'英文'}</div></span>
      <span class="fav">${isFav?'❤️':'♡'}</span>`;
    d.querySelector('.nm').onclick=()=>play(i);
    d.querySelector('.fav').onclick=(e)=>{ e.stopPropagation(); toggleFav(s.name); };
    listEl.appendChild(d);
  });
}
const itemInKey='@keyframes itemIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}';
const st=document.createElement('style');st.textContent=itemInKey;document.head.appendChild(st);

// 播放模式整合到一个按钮
const MODES=[
  {key:'list',label:'🔂 列表循环'},
  {key:'loop',label:'🔁 单曲循环'},
  {key:'random',label:'🔀 随机播放'}
];
function cycleMode(){
  const idx=MODES.findIndex(m=>m.key===mode);
  mode=MODES[(idx+1)%MODES.length].key;
  document.getElementById('modeChip').textContent=MODES.find(m=>m.key===mode).label;
  toast('播放模式：'+MODES.find(m=>m.key===mode).label.replace(/^\S+\s/,''));
}

// 播放
function play(i){
  if(i<0||i>=SONGS.length) return;
  current=i;
  audio.src=SONGS[i].url;
  audio.playbackRate=speed;
  audio.play();
  document.getElementById('nowName').textContent=SONGS[i].name;
  document.getElementById('detailTitle').textContent=SONGS[i].name;
  updateFavBtn();
  renderList(document.getElementById('search').value);
  updateMediaSession();
  loadLrc();
  updateFloat();
  openDetail();
  preloadNext();
}

// 预加载：预取下一首，让点击后快速播放
const preloaders={};
function preloadNext(){
  const nextIdx=(current+1)%SONGS.length;
  if(!preloaders[nextIdx]){
    const p=new Audio();
    p.preload='auto';
    p.src=SONGS[nextIdx].url;
    preloaders[nextIdx]=p;
  }
}

function toggle(e){ if(e) e.stopPropagation(); if(current<0){ play(0); return; } if(audio.paused){ audio.play(); } else { audio.pause(); } }
function prev(e){ if(e) e.stopPropagation(); if(current>0) play(current-1); else play(SONGS.length-1); }
function next(e){ if(e) e.stopPropagation();
  if(current<0){ play(0); return; }
  if(mode==='random'){ let r; do{ r=Math.floor(Math.random()*SONGS.length); }while(r===current&&SONGS.length>1); play(r); return; }
  play((current+1)%SONGS.length);
}
audio.addEventListener('play',()=>{ document.getElementById('playBtn').textContent='⏸'; document.getElementById('fPlay').textContent='⏸'; });
audio.addEventListener('pause',()=>{ document.getElementById('playBtn').textContent='▶'; document.getElementById('fPlay').textContent='▶'; });
audio.addEventListener('ended',()=>{
  if(mode==='loop'){ audio.currentTime=0; audio.play(); }
  else next();
});

// 进度条 + 时间（用 rAF 高频刷新保证同步）
const progress=document.getElementById('progress'), fill=document.getElementById('progFill'), knob=document.getElementById('progKnob');
const curTimeEl=document.getElementById('curTime'), durTimeEl=document.getElementById('durTime');
function fmt(s){ if(!isFinite(s)||isNaN(s)) return '0:00'; s=Math.floor(s); const m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; }
function updateProgress(){
  const dur=audio.duration||0;
  durTimeEl.textContent=fmt(dur);
  curTimeEl.textContent=fmt(audio.currentTime);
  if(dur){
    const pct=audio.currentTime/dur*100;
    fill.style.width=pct+'%'; knob.style.left=pct+'%';
  }
}
function syncLoop(){
  if(current>=0 && !audio.paused){
    updateProgress();
    syncLrc(audio.currentTime);
  }
  requestAnimationFrame(syncLoop);
}
syncLoop();

progress.addEventListener('click',e=>{ if(!audio.duration) return; const r=progress.getBoundingClientRect(); audio.currentTime=(e.clientX-r.left)/r.width*audio.duration; updateProgress(); });
let dragging=false;
progress.addEventListener('mousedown',e=>{ dragging=true; seekBy(e); });
window.addEventListener('mousemove',e=>{ if(dragging) seekBy(e); });
window.addEventListener('mouseup',()=>dragging=false);
function seekBy(e){ if(!audio.duration) return; const r=progress.getBoundingClientRect(); let pct=(e.clientX-r.left)/r.width; pct=Math.max(0,Math.min(1,pct)); audio.currentTime=pct*audio.duration; updateProgress(); }

// 倍速
document.getElementById('speedBar').addEventListener('click',e=>{
  const chip=e.target.closest('.chip'); if(!chip) return;
  document.querySelectorAll('#speedBar .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  speed=parseFloat(chip.dataset.s);
  audio.playbackRate=speed;
});

// 歌词（翻译行一并同步，rAF 驱动无滞后）
let lrcArr=[];
async function loadLrc(){
  lrcArr=[]; const lyr=document.getElementById('lyrics');
  if(current<0) return;
  lyr.innerHTML='<div class="no-lrc">加载中...</div>';
  try{
    const r=await fetch(SONGS[current].lrc);
    const txt=await r.text();
    parseLrc(txt);
    if(lrcArr.length) renderLrc(); else lyr.innerHTML=noLrcHtml();
  }catch(e){ lyr.innerHTML=noLrcHtml(); }
}
function noLrcHtml(){
  const u=localStorage.getItem('lhb_user');
  return `<div class="no-lrc">未搜索到歌词${u?`<br><button class="req" onclick="openRequest()">📝 求这首歌</button>`:''}</div>`;
}
function parseLrc(txt){
  lrcArr=[];
  txt.split('\n').forEach(line=>{
    const m=line.match(/\[(\d+):(\d+)(?:[.:](\d+))?\](.*)/);
    if(m){ lrcArr.push({t:parseInt(m[1])*60+parseInt(m[2])+(parseInt(m[3]||0)/100),text:m[4].trim()}); }
  });
  lrcArr.sort((a,b)=>a.t-b.t);
}
function renderLrc(){
  const lyr=document.getElementById('lyrics');
  lyr.innerHTML=lrcArr.map((l,i)=>`<div class="ly" data-i="${i}">${l.text||'♪'}</div>`).join('');
}
function syncLrc(time){
  if(!lrcArr.length||userInteracting) return;
  let idx=-1;
  for(let i=0;i<lrcArr.length;i++){ if(time>=lrcArr[i].t) idx=i; else break; }
  if(idx<0) return;
  const lyr=document.getElementById('lyrics');
  const els=lyr.querySelectorAll('.ly');
  let changed=false;
  els.forEach((el,i)=>{
    const act=i===idx;
    if(el.classList.contains('active')!==act){ el.classList.toggle('active',act); changed=true; }
  });
  if(changed && els[idx]) els[idx].scrollIntoView({block:'center',behavior:'smooth'});
}
// 歌词交互：停止后3秒恢复对齐
document.getElementById('lyrics').addEventListener('touchstart',()=>{ userInteracting=true; clearTimeout(resetTimer); });
document.getElementById('lyrics').addEventListener('touchend',()=>{ resetTimer=setTimeout(()=>{ userInteracting=false; },3000); });
document.getElementById('lyrics').addEventListener('scroll',()=>{ userInteracting=true; clearTimeout(resetTimer); resetTimer=setTimeout(()=>{ userInteracting=false; },3000); });

// 收藏
function toggleFav(name){
  if(!localStorage.getItem('lhb_user')){ openLogin(); return; }
  const pos=favs.indexOf(name);
  if(pos>=0) favs.splice(pos,1); else favs.push(name);
  saveFavs(); renderList(document.getElementById('search').value); updateFavBtn();
}
function toggleFavDetail(){
  if(current<0) return;
  if(!localStorage.getItem('lhb_user')){ openLogin(); return; }
  toggleFav(SONGS[current].name);
}
function updateFavBtn(){
  const btn=document.getElementById('detailFav');
  if(current>=0 && favs.includes(SONGS[current].name)){
    btn.textContent='❤️ 已收藏'; btn.classList.add('active');
  } else {
    btn.textContent='♡ 收藏'; btn.classList.remove('active');
  }
}
function openFav(){
  if(!localStorage.getItem('lhb_user')){ openLogin(); return; }
  location.href='favorites.html';
}

// 悬浮详情窗
const detail=document.getElementById('detail');
function openDetail(){
  detail.classList.add('show');
  document.getElementById('floatW').classList.remove('show');
  if(window.innerWidth>600){
    detail.style.left=(window.innerWidth/2-200)+'px';
    detail.style.top=(window.innerHeight/2-280)+'px';
    detail.style.right='auto'; detail.style.bottom='auto';
  }
}
function closeDetail(){
  detail.classList.remove('show');
  if(current>=0) document.getElementById('floatW').classList.add('show');
}
// 详情窗拖拽：仅手动拖动才移动
let detailDragging=false, dStartX=0, dStartY=0, dMoved=false;
detail.addEventListener('mousedown',e=>{
  if(window.innerWidth<=600) return;
  if(e.target.closest('.ctrl')||e.target.closest('.progress')||e.target.closest('.lyrics')||e.target.closest('.chip')||e.target.closest('.mode-chip')||e.target.closest('.fav-btn')||e.target.closest('.fd-back')) return;
  dStartX=e.clientX; dStartY=e.clientY; detailDragging=true; dMoved=false;
});
window.addEventListener('mousemove',e=>{
  if(!detailDragging) return;
  const dx=e.clientX-dStartX, dy=e.clientY-dStartY;
  if(Math.abs(dx)>5||Math.abs(dy)>5) dMoved=true;
  if(dMoved){
    detail.style.left=(detail.offsetLeft+dx)+'px';
    detail.style.top=(detail.offsetTop+dy)+'px';
    detail.style.right='auto'; detail.style.bottom='auto';
    dStartX=e.clientX; dStartY=e.clientY;
  }
});
window.addEventListener('mouseup',()=>{ detailDragging=false; });

// 迷你悬浮球
const floatW=document.getElementById('floatW');
function updateFloat(){ document.getElementById('fName').textContent=SONGS[current].name; }
function closeFloat(e){ e.stopPropagation(); audio.pause(); audio.src=''; current=-1; document.getElementById('floatW').classList.remove('show'); detail.classList.remove('show'); }
// 悬浮球拖拽：仅手动拖动才移动，点击打开详情
let floatDragging=false, fStartX=0, fStartY=0, fMoved=false;
floatW.addEventListener('mousedown',e=>{
  if(e.target.closest('.f-close')) return;
  fStartX=e.clientX; fStartY=e.clientY; floatDragging=true; fMoved=false;
});
window.addEventListener('mousemove',e=>{
  if(!floatDragging) return;
  const dx=e.clientX-fStartX, dy=e.clientY-fStartY;
  if(Math.abs(dx)>5||Math.abs(dy)>5) fMoved=true;
  if(fMoved){
    floatW.style.left=(floatW.offsetLeft+dx)+'px';
    floatW.style.top=(floatW.offsetTop+dy)+'px';
    floatW.style.right='auto'; floatW.style.bottom='auto';
    fStartX=e.clientX; fStartY=e.clientY;
  }
});
window.addEventListener('mouseup',()=>{ floatDragging=false; });
floatW.addEventListener('click',e=>{ if(fMoved){ fMoved=false; return; } openDetail(); });

// 登录/注册
function openLogin(){ showLogin(); }
function showLogin(){ document.getElementById('regModal').classList.remove('show'); document.getElementById('loginModal').classList.add('show'); }
function showReg(){ document.getElementById('loginModal').classList.remove('show'); document.getElementById('regModal').classList.add('show'); }
function hideModal(el){
  const box=el.querySelector('.modal-box');
  if(box) box.classList.add('modal-out');
  setTimeout(()=>{ el.classList.remove('show'); if(box) box.classList.remove('modal-out'); },180);
}
document.getElementById('closeLogin').onclick=()=>hideModal(document.getElementById('loginModal'));
document.getElementById('closeReg').onclick=()=>hideModal(document.getElementById('regModal'));
document.getElementById('loginModal').addEventListener('click',e=>{ if(e.target.id==='loginModal')hideModal(e.target); });
document.getElementById('regModal').addEventListener('click',e=>{ if(e.target.id==='regModal')hideModal(e.target); });
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim(), p=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  if(!u||!p){ err.textContent='请填写用户名和密码'; return; }
  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const data=await r.json();
    if(data&&data.code===0){ localStorage.setItem('lhb_user',u); err.textContent=''; hideModal(document.getElementById('loginModal')); loadFavs(); renderList(document.getElementById('search').value); updateFavBtn(); toast('登录成功'); }
    else err.textContent=(data&&data.msg)||'用户名或密码错误';
  }catch(e){ err.textContent='网络错误，请重试'; }
}
async function doReg(){
  const u=document.getElementById('regUser').value.trim(), p=document.getElementById('regPass').value;
  const err=document.getElementById('regErr');
  if(!u||!p){ err.textContent='请填写用户名和密码'; return; }
  try{
    const r=await fetch(API+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const data=await r.json();
    if(data&&data.code===0){ localStorage.setItem('lhb_user',u); err.textContent=''; hideModal(document.getElementById('regModal')); loadFavs(); renderList(document.getElementById('search').value); updateFavBtn(); toast('注册成功'); }
    else err.textContent=(data&&data.msg)||'注册失败';
  }catch(e){ err.textContent='网络错误，请重试'; }
}

// 求歌（3分钟防脚本）
function openRequest(){
  if(!localStorage.getItem('lhb_user')){ openLogin(); return; }
  const u=localStorage.getItem('lhb_user');
  const last=parseFloat(localStorage.getItem(LAST_REQ_KEY+u)||'0');
  const wait=180-(Date.now()-last)/1000;
  if(wait>0){ toast('请 '+Math.ceil(wait)+' 秒后再提交'); return; }
  document.getElementById('reqModal').classList.add('show'); document.getElementById('reqErr').textContent='';
}
document.getElementById('closeReq').onclick=()=>hideModal(document.getElementById('reqModal'));
document.getElementById('reqModal').addEventListener('click',e=>{ if(e.target.id==='reqModal')hideModal(e.target); });
async function submitReq(){
  const name=document.getElementById('reqName').value.trim();
  const note=document.getElementById('reqNote').value.trim();
  const err=document.getElementById('reqErr');
  if(!name){ err.textContent='请输入歌曲名'; return; }
  const u=localStorage.getItem('lhb_user');
  const headers={'Content-Type':'application/json'};
  if(u) headers['X-User-Id']=u;
  try{
    const r=await fetch(API+'/request-song',{method:'POST',headers,body:JSON.stringify({song:name,note})});
    const data=await r.json();
    if(data&&data.code===0){ localStorage.setItem(LAST_REQ_KEY+u,Date.now()); hideModal(document.getElementById('reqModal')); document.getElementById('reqName').value=''; document.getElementById('reqNote').value=''; toast('求歌提交成功！'); }
    else err.textContent=(data&&data.msg)||'提交失败';
  }catch(e){ err.textContent='网络错误，请重试'; }
}

// 搜索
document.getElementById('search').addEventListener('input',e=>renderList(e.target.value));

// Media Session
function updateMediaSession(){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata=new MediaMetadata({title:SONGS[current].name,artist:'LHB 工具箱',album:'在线音乐'});
  navigator.mediaSession.setActionHandler('play',()=>audio.play());
  navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack',prev);
  navigator.mediaSession.setActionHandler('nexttrack',next);
}

// 接收收藏夹播放指令
function handleFavPlay(){
  const params=new URLSearchParams(location.search);
  if(params.get('play')!=='fav') return;
  const u=localStorage.getItem('lhb_user');
  if(!u){ toast('请先登录'); return; }
  loadFavs();
  if(!favs.length){ toast('收藏夹为空'); return; }
  const names=favs;
  const idxs=names.map(n=>SONGS.findIndex(s=>s.name===n)).filter(i=>i>=0);
  if(!idxs.length){ toast('收藏夹为空'); return; }
  window.__favQueue=idxs; window.__favPos=0;
  play(idxs[0]);
  const origNext=window.next;
  window.next=function(e){ if(e)e.stopPropagation(); if(window.__favQueue){ window.__favPos++; if(window.__favPos>=window.__favQueue.length){ window.__favPos=0; } play(window.__favQueue[window.__favPos]); } else origNext(e); };
}

// 返回按钮：从收藏夹进入时返回收藏夹
(function(){
  const params=new URLSearchParams(location.search);
  if(params.get('from')==='fav'){
    document.getElementById('backLink').href='favorites.html';
  }
})();

// 初始化
loadFavs();
renderList();
loadLrc();
handleFavPlay();
</script>
