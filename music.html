<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>音乐播放器 - 工具箱</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#0d0d1a 0%,#1a0d2a 35%,#2a1040 70%,#0d0a1a 100%);
  min-height:100vh; color:#f3e8ff;
}
.wrap { max-width:860px; margin:0 auto; padding:16px; padding-bottom:120px; }
.topbar { display:flex; align-items:center; gap:14px; padding:14px 4px 18px; }
.back { font-size:28px; color:#f472b6; cursor:pointer; text-decoration:none; }
.title { font-size:24px; font-weight:800; color:#f472b6; flex:1; }
.topbtns { display:flex; gap:8px; }
.topbtns button { padding:7px 14px; border-radius:18px; border:1px solid rgba(244,114,182,.5); background:rgba(244,114,182,.15); color:#f9a8d4; font-size:13px; font-weight:600; cursor:pointer; }
.topbtns button:hover { filter:brightness(1.2); }

/* 搜索 */
.search { margin-bottom:16px; }
.search input { width:100%; padding:12px 18px; border-radius:24px; border:1px solid rgba(168,85,247,.4); background:rgba(255,255,255,.05); color:#fff; font-size:15px; outline:none; }
.search input:focus { border-color:#f472b6; }

/* 歌曲列表 */
.songlist { display:flex; flex-direction:column; gap:10px; }
.song {
  display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:14px; cursor:pointer;
  background:rgba(50,20,70,.4); border-left:4px solid; transition:transform .3s, box-shadow .3s;
}
.song:hover { transform:scale(1.02); box-shadow:0 0 20px rgba(244,114,182,.3); }
.song.playing { background:rgba(244,114,182,.15); }
.song .idx { width:26px; text-align:center; color:#8b84a8; font-size:13px; }
.song .nm { flex:1; }
.song .nm .t { font-size:16px; font-weight:600; }
.song .nm .a { font-size:12px; opacity:.6; }
.song .fav { font-size:20px; cursor:pointer; }
.song .eq { display:none; font-size:14px; color:#f472b6; }
.song.playing .eq { display:block; }
.song.playing .idx { display:none; }
.c0{border-color:#f472b6;} .c1{border-color:#a78bfa;} .c2{border-color:#22d3ee;} .c3{border-color:#fb923c;}
.c4{border-color:#34d399;} .c5{border-color:#fbbf24;} .c6{border-color:#60a5fa;} .c7{border-color:#f87171;}

/* 播放详情面板 */
.detail {
  position:fixed; left:50%; transform:translateX(-50%); top:0; bottom:0; width:100%; max-width:860px;
  background:linear-gradient(180deg,rgba(26,16,48,.98),rgba(20,10,40,.98)); z-index:50; display:none; overflow-y:auto;
}
.detail.show { display:block; }
.detail-head { display:flex; align-items:center; gap:14px; padding:16px; position:sticky; top:0; background:rgba(20,10,40,.95); z-index:2; }
.detail-back { font-size:26px; color:#c084fc; cursor:pointer; }
.detail-title { font-size:20px; font-weight:800; color:#e9d5ff; flex:1; }
.detail-body { padding:10px 20px 30px; }
.now-name { font-size:26px; font-weight:800; text-align:center; margin:10px 0 6px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.now-artist { text-align:center; color:#8b84a8; font-size:14px; margin-bottom:20px; }

/* 歌词 */
.lyrics { height:200px; overflow-y:auto; text-align:center; padding:10px 0; margin-bottom:16px; }
.lyrics .ly { padding:6px 0; color:#8b84a8; font-size:15px; transition:all .3s; }
.lyrics .ly.active { color:#c084fc; font-size:18px; font-weight:700; }
.no-lrc { text-align:center; color:#8b84a8; padding:60px 0; }

/* 进度条 */
.progress { position:relative; height:6px; border-radius:3px; background:rgba(255,255,255,.2); cursor:pointer; margin-bottom:12px; }
.progress .fill { position:absolute; left:0; top:0; height:100%; border-radius:3px;
  background:linear-gradient(90deg,#a855f7,#7c3aed); }
.progress .knob { position:absolute; top:50%; transform:translate(-50%,-50%); width:14px; height:14px; border-radius:50%;
  background:#a855f7; box-shadow:0 0 8px rgba(168,85,247,.6); }

/* 控制栏 */
.ctrl { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px; }
.ctrl button { background:none; border:none; color:#f3e8ff; font-size:26px; cursor:pointer; padding:0 10px; }
.ctrl .big { font-size:46px; color:#c084fc; }

/* 倍速 & 模式 */
.toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:6px; }
.chip { padding:6px 12px; border-radius:16px; font-size:13px; cursor:pointer; border:1px solid rgba(168,85,247,.4); background:rgba(255,255,255,.05); color:#a99ec9; }
.chip.active { background:linear-gradient(90deg,#a855f7,#7c3aed); color:#fff; border-color:transparent; }

/* 弧形悬浮窗 */
.float {
  position:fixed; right:10px; bottom:90px; width:120px; height:120px; border-radius:50% 50% 50% 12px;
  background:linear-gradient(135deg,#a855f7,#7c3aed); display:none; align-items:center; justify-content:center;
  box-shadow:0 4px 20px rgba(168,85,247,.5); z-index:60; cursor:pointer; color:#fff; text-align:center;
}
.float.show { display:flex; }
.float .f-name { font-size:12px; font-weight:700; max-width:80px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.float .f-close { position:absolute; top:2px; right:6px; font-size:16px; color:#fff; cursor:pointer; z-index:2; }
.float .f-ctrls { position:absolute; bottom:14px; left:0; right:0; display:flex; justify-content:center; gap:12px; font-size:18px; }

/* 弹窗 */
.modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; z-index:1000; }
.modal-mask.show { display:flex; }
.modal-box { width:90%; max-width:340px; background:#1a1030; border:1px solid rgba(168,85,247,.4); border-radius:18px; padding:26px 22px; position:relative; }
.modal-box h3 { text-align:center; margin-bottom:18px; font-size:20px; color:#f3e8ff; }
.close-x { position:absolute; top:10px; right:14px; font-size:22px; color:#8b84a8; cursor:pointer; background:none; border:none; z-index:2; }
.close-x:hover { color:#fff; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:13px; color:#a99ec9; margin-bottom:6px; }
.field input, .field textarea { width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(168,85,247,.35); background:rgba(255,255,255,.05); color:#fff; font-size:15px; outline:none; }
.field textarea { resize:none; min-height:70px; }
.field input:focus, .field textarea:focus { border-color:#f472b6; }
.modal-btn { width:100%; padding:12px; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; margin-top:6px;
  background:linear-gradient(90deg,#a855f7,#7c3aed); color:#fff; }
.modal-btn:hover { filter:brightness(1.1); }
.err { color:#f87171; font-size:13px; text-align:center; margin-top:8px; min-height:18px; }
.switch { text-align:center; margin-top:14px; font-size:13px; color:#a99ec9; }
.switch a { color:#c084fc; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <span class="title">🎵 音乐播放器</span>
    <div class="topbtns">
      <button onclick="openFav()">♡ 收藏</button>
      <button onclick="openRequest()">📝 求歌</button>
    </div>
  </div>
  <div class="search"><input id="search" placeholder="搜索歌曲..."></div>
  <div class="songlist" id="songlist"></div>
</div>

<!-- 播放详情面板 -->
<div class="detail" id="detail">
  <div class="detail-head">
    <span class="detail-back" onclick="closeDetail()">‹</span>
    <span class="detail-title">正在播放</span>
  </div>
  <div class="detail-body">
    <div class="now-name" id="nowName">未播放</div>
    <div class="now-artist" id="nowArtist">LHB 工具箱</div>
    <div class="lyrics" id="lyrics"><div class="no-lrc">暂无歌词</div></div>
    <div class="progress" id="progress">
      <div class="fill" id="progFill"></div>
      <div class="knob" id="progKnob"></div>
    </div>
    <div class="toolbar" id="speedBar">
      <span class="chip" data-s="0.5">0.5x</span>
      <span class="chip" data-s="0.75">0.75x</span>
      <span class="chip active" data-s="1">1x</span>
      <span class="chip" data-s="1.25">1.25x</span>
      <span class="chip" data-s="1.5">1.5x</span>
      <span class="chip" data-s="2">2x</span>
    </div>
    <div class="toolbar" id="modeBar">
      <span class="chip" data-m="loop">🔁 单曲循环</span>
      <span class="chip active" data-m="list">🔂 列表循环</span>
      <span class="chip" data-m="random">🔀 随机播放</span>
    </div>
    <div class="ctrl">
      <button onclick="prev()">⏮</button>
      <button class="big" id="playBtn" onclick="toggle()">▶</button>
      <button onclick="next()">⏭</button>
    </div>
  </div>
</div>

<!-- 弧形悬浮窗 -->
<div class="float" id="floatW">
  <span class="f-close" onclick="closeFloat(event)">✕</span>
  <div class="f-name" id="fName">未播放</div>
  <div class="f-ctrls">
    <span onclick="prev(event)">⏮</span>
    <span id="fPlay" onclick="toggle(event)">▶</span>
    <span onclick="next(event)">⏭</span>
  </div>
</div>

<!-- 登录弹窗 -->
<div class="modal-mask" id="loginModal">
  <div class="modal-box">
    <button class="close-x" id="closeLogin">✕</button>
    <h3>登录</h3>
    <div class="field"><label>用户名</label><input id="loginUser" placeholder="请输入用户名"></div>
    <div class="field"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码"></div>
    <div class="err" id="loginErr"></div>
    <button class="modal-btn" onclick="doLogin()">登 录</button>
    <div class="switch">没有账号？<a onclick="showReg()">立即注册</a></div>
  </div>
</div>

<!-- 注册弹窗 -->
<div class="modal-mask" id="regModal">
  <div class="modal-box">
    <button class="close-x" id="closeReg">✕</button>
    <h3>注册</h3>
    <div class="field"><label>用户名</label><input id="regUser" placeholder="请输入用户名"></div>
    <div class="field"><label>密码</label><input id="regPass" type="password" placeholder="请输入密码"></div>
    <div class="err" id="regErr"></div>
    <button class="modal-btn" onclick="doReg()">注 册</button>
    <div class="switch">已有账号？<a onclick="showLogin()">去登录</a></div>
  </div>
</div>

<!-- 求歌弹窗 -->
<div class="modal-mask" id="reqModal">
  <div class="modal-box">
    <button class="close-x" id="closeReq">✕</button>
    <h3>求歌</h3>
    <div class="field"><label>歌曲名</label><input id="reqName" placeholder="请输入想听的歌"></div>
    <div class="field"><label>备注</label><textarea id="reqNote" placeholder="歌手 / 版本等（选填）"></textarea></div>
    <div class="err" id="reqErr"></div>
    <button class="modal-btn" onclick="submitReq()">提交请求</button>
  </div>
</div>

<script>
const API='https://sb.lhb2009.cc.cd';
const CDN='https://cdn.jsdelivr.net/gh/zuiaidiuguo/lhb2009-website@master/music/';
const FAV_KEY='lhb_fav_';
const LAST_REQ_KEY='lhb_req_time_';

const SONGS=[
  '爱错','爱情讯息','稻香','告白气球','红色高跟鞋','花海','鹿 be free','青花瓷','兰亭序','你从未离去','清空','晴天','我乘着风飞过来','心之火（DJ版）','最后一页','第57次取消发送',
  'All For Love','All My People','Counting Stars','Edge Of My Life','Fever Pitch-Richz','Good Time','Monsters','Nevada','Power','Remember Our Summer','Sold Out','Teeth','That Girl','The King','This Is It','Unstoppable','Wake'
].map((n,i)=>({name:n,url:CDN+encodeURIComponent(n)+'.mp3',lrc:CDN+encodeURIComponent(n)+'.lrc'}));

let current=-1, favs=[], queue=[], mode='list', speed=1;
let userInteracting=false, resetTimer=null;
let lastReqTime=0;
const audio=new Audio();
audio.preload='metadata';

function getFavKey(){ const u=localStorage.getItem('lhb_user'); return FAV_KEY+(u||'guest'); }
function loadFavs(){ try{ favs=JSON.parse(localStorage.getItem(getFavKey())||'[]'); }catch(e){ favs=[]; } }
function saveFavs(){ localStorage.setItem(getFavKey(),JSON.stringify(favs)); }

// 渲染列表
const listEl=document.getElementById('songlist');
function renderList(filter){
  listEl.innerHTML='';
  const kw=(filter||'').toLowerCase();
  SONGS.forEach((s,i)=>{
    if(kw && !s.name.toLowerCase().includes(kw)) return;
    const d=document.createElement('div');
    d.className='song c'+(i%8)+((i===current)?' playing':'');
    const isFav=favs.includes(s.name);
    d.innerHTML=`<span class="idx">${i+1}</span><span class="eq">♪</span>
      <span class="nm"><div class="t">${s.name}</div><div class="a">${i<16?'中文':'英文'}</div></span>
      <span class="fav">${isFav?'❤️':'♡'}</span>`;
    d.querySelector('.nm').onclick=()=>play(i);
    d.querySelector('.fav').onclick=(e)=>{ e.stopPropagation(); toggleFav(s.name); };
    listEl.appendChild(d);
  });
}

// 播放
function play(i){
  current=i; queue=[i];
  audio.src=SONGS[i].url;
  audio.playbackRate=speed;
  audio.play();
  document.getElementById('nowName').textContent=SONGS[i].name;
  renderList(document.getElementById('search').value);
  updateMediaSession();
  loadLrc();
  updateFloat();
  openDetail();
}
function toggle(e){ if(e) e.stopPropagation(); if(current<0){ play(0); return; } if(audio.paused){ audio.play(); } else { audio.pause(); } }
function prev(e){ if(e) e.stopPropagation(); if(current>0) play(current-1); else play(SONGS.length-1); }
function next(e){ if(e) e.stopPropagation();
  if(mode==='random'){ play(Math.floor(Math.random()*SONGS.length)); return; }
  play((current+1)%SONGS.length);
}
audio.addEventListener('play',()=>{ document.getElementById('playBtn').textContent='⏸'; document.getElementById('fPlay').textContent='⏸'; });
audio.addEventListener('pause',()=>{ document.getElementById('playBtn').textContent='▶'; document.getElementById('fPlay').textContent='▶'; });
audio.addEventListener('ended',()=>{
  if(mode==='loop'){ audio.currentTime=0; audio.play(); }
  else next();
});
audio.addEventListener('timeupdate',updateProgress);

// 进度条
const progress=document.getElementById('progress'), fill=document.getElementById('progFill'), knob=document.getElementById('progKnob');
function updateProgress(){
  if(!audio.duration){ document.getElementById('nowTime')&&(document.getElementById('nowTime').textContent=''); return; }
  const pct=audio.currentTime/audio.duration*100;
  fill.style.width=pct+'%'; knob.style.left=pct+'%';
}
progress.addEventListener('click',e=>{ if(!audio.duration) return; const r=progress.getBoundingClientRect(); audio.currentTime=(e.clientX-r.left)/r.width*audio.duration; updateProgress(); });
let dragging=false;
progress.addEventListener('mousedown',e=>{ dragging=true; seekBy(e); });
window.addEventListener('mousemove',e=>{ if(dragging) seekBy(e); });
window.addEventListener('mouseup',()=>dragging=false);
function seekBy(e){ if(!audio.duration) return; const r=progress.getBoundingClientRect(); let pct=(e.clientX-r.left)/r.width; pct=Math.max(0,Math.min(1,pct)); audio.currentTime=pct*audio.duration; updateProgress(); }

// 倍速
document.getElementById('speedBar').addEventListener('click',e=>{
  const chip=e.target.closest('.chip'); if(!chip) return;
  document.querySelectorAll('#speedBar .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  speed=parseFloat(chip.dataset.s);
  audio.playbackRate=speed;
});
// 播放模式
document.getElementById('modeBar').addEventListener('click',e=>{
  const chip=e.target.closest('.chip'); if(!chip) return;
  document.querySelectorAll('#modeBar .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  mode=chip.dataset.m;
});

// 歌词
let lrcArr=[];
async function loadLrc(){
  lrcArr=[]; const lyr=document.getElementById('lyrics');
  if(current<0) return;
  lyr.innerHTML='<div class="no-lrc">加载中...</div>';
  try{
    const r=await fetch(SONGS[current].lrc);
    const txt=await r.text();
    parseLrc(txt);
    if(lrcArr.length) renderLrc(); else lyr.innerHTML='<div class="no-lrc">该歌暂无歌词</div>';
  }catch(e){ lyr.innerHTML='<div class="no-lrc">该歌暂无歌词</div>'; }
}
function parseLrc(txt){
  lrcArr=[];
  txt.split('\n').forEach(line=>{
    const m=line.match(/\[(\d+):(\d+)(?:[.:](\d+))?\](.*)/);
    if(m){ lrcArr.push({t:parseInt(m[1])*60+parseInt(m[2])+(parseInt(m[3]||0)/100),text:m[4].trim()}); }
  });
  lrcArr.sort((a,b)=>a.t-b.t);
}
function renderLrc(){
  const lyr=document.getElementById('lyrics');
  lyr.innerHTML=lrcArr.map((l,i)=>`<div class="ly" data-i="${i}">${l.text||'♪'}</div>`).join('');
  const el=lyr.querySelectorAll('.ly');
  el.forEach(item=>{
    item.addEventListener('touchstart',()=>{ userInteracting=true; clearTimeout(resetTimer); });
    item.addEventListener('scroll',()=>{ userInteracting=true; clearTimeout(resetTimer); });
  });
}
audio.addEventListener('timeupdate',()=>{
  if(!lrcArr.length||userInteracting) return;
  let idx=-1;
  for(let i=0;i<lrcArr.length;i++){ if(audio.currentTime>=lrcArr[i].t) idx=i; else break; }
  if(idx>=0) highlightLrc(idx);
});
function highlightLrc(idx){
  const lyr=document.getElementById('lyrics');
  const els=lyr.querySelectorAll('.ly');
  els.forEach((el,i)=>el.classList.toggle('active',i===idx));
  if(els[idx]) els[idx].scrollIntoView({block:'center',behavior:'smooth'});
}
// 歌词交互：停止后3.5秒恢复对齐
document.getElementById('lyrics').addEventListener('touchstart',()=>{ userInteracting=true; clearTimeout(resetTimer); });
document.getElementById('lyrics').addEventListener('touchend',()=>{ resetTimer=setTimeout(()=>{ userInteracting=false; },3500); });
document.getElementById('lyrics').addEventListener('scroll',()=>{ userInteracting=true; clearTimeout(resetTimer); resetTimer=setTimeout(()=>{ userInteracting=false; },3500); });

// 收藏
function toggleFav(name){
  if(!localStorage.getItem('lhb_user')){ openLogin(); return; }
  const pos=favs.indexOf(name);
  if(pos>=0) favs.splice(pos,1); else favs.push(name);
  saveFavs(); renderList(document.getElementById('search').value);
}
function openFav(){
  if(!localStorage.getItem('lhb_user')){ openLogin(); return; }
  location.href='favorites.html';
}

// 播放详情
function openDetail(){ document.getElementById('detail').classList.add('show'); document.getElementById('floatW').classList.remove('show'); }
function closeDetail(){ document.getElementById('detail').classList.remove('show'); if(current>=0) document.getElementById('floatW').classList.add('show'); }

// 弧形悬浮窗
const floatW=document.getElementById('floatW');
function updateFloat(){ document.getElementById('fName').textContent=SONGS[current].name; }
function closeFloat(e){ e.stopPropagation(); audio.pause(); audio.src=''; current=-1; document.getElementById('floatW').classList.remove('show'); document.getElementById('detail').classList.remove('show'); }
// 悬浮窗拖拽 vs 点击
let floatDrag=false,startX=0,startY=0;
floatW.addEventListener('mousedown',e=>{ startX=e.clientX; startY=e.clientY; floatDrag=false; });
window.addEventListener('mousemove',e=>{ if(e.target.closest('#floatW')){ if(Math.abs(e.clientX-startX)>8||Math.abs(e.clientY-startY)>8){ floatDrag=true; floatW.style.right='auto'; floatW.style.bottom='auto'; floatW.style.left=(e.clientX-60)+'px'; floatW.style.top=(e.clientY-60)+'px'; } } });
floatW.addEventListener('click',e=>{ if(floatDrag){ floatDrag=false; return; } openDetail(); });

// 登录/注册
function openLogin(){ showLogin(); }
function showLogin(){ document.getElementById('regModal').classList.remove('show'); document.getElementById('loginModal').classList.add('show'); }
function showReg(){ document.getElementById('loginModal').classList.remove('show'); document.getElementById('regModal').classList.add('show'); }
document.getElementById('closeLogin').onclick=()=>document.getElementById('loginModal').classList.remove('show');
document.getElementById('closeReg').onclick=()=>document.getElementById('regModal').classList.remove('show');
document.getElementById('loginModal').addEventListener('click',e=>{ if(e.target.id==='loginModal')e.target.classList.remove('show'); });
document.getElementById('regModal').addEventListener('click',e=>{ if(e.target.id==='regModal')e.target.classList.remove('show'); });
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim(), p=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  if(!u||!p){ err.textContent='请填写用户名和密码'; return; }
  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const data=await r.json();
    if(data&&data.ok){ localStorage.setItem('lhb_user',u); err.textContent=''; document.getElementById('loginModal').classList.remove('show'); loadFavs(); renderList(document.getElementById('search').value); }
    else err.textContent=(data&&data.msg)||'用户名或密码错误';
  }catch(e){ err.textContent='网络错误，请重试'; }
}
async function doReg(){
  const u=document.getElementById('regUser').value.trim(), p=document.getElementById('regPass').value;
  const err=document.getElementById('regErr');
  if(!u||!p){ err.textContent='请填写用户名和密码'; return; }
  try{
    const r=await fetch(API+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const data=await r.json();
    if(data&&data.ok){ localStorage.setItem('lhb_user',u); err.textContent=''; document.getElementById('regModal').classList.remove('show'); loadFavs(); renderList(document.getElementById('search').value); }
    else err.textContent=(data&&data.msg)||'注册失败';
  }catch(e){ err.textContent='网络错误，请重试'; }
}

// 求歌（3分钟防脚本）
function openRequest(){
  if(!localStorage.getItem('lhb_user')){ openLogin(); return; }
  const u=localStorage.getItem('lhb_user');
  const last=parseFloat(localStorage.getItem(LAST_REQ_KEY+u)||'0');
  const wait=180-(Date.now()-last)/1000;
  if(wait>0){ alert('请 '+Math.ceil(wait)+' 秒后再提交'); return; }
  document.getElementById('reqModal').classList.add('show'); document.getElementById('reqErr').textContent='';
}
document.getElementById('closeReq').onclick=()=>document.getElementById('reqModal').classList.remove('show');
document.getElementById('reqModal').addEventListener('click',e=>{ if(e.target.id==='reqModal')e.target.classList.remove('show'); });
async function submitReq(){
  const name=document.getElementById('reqName').value.trim();
  const note=document.getElementById('reqNote').value.trim();
  const err=document.getElementById('reqErr');
  if(!name){ err.textContent='请输入歌曲名'; return; }
  const u=localStorage.getItem('lhb_user');
  const headers={'Content-Type':'application/json'};
  if(u) headers['X-User-Id']=u;
  try{
    const r=await fetch(API+'/request-song',{method:'POST',headers,body:JSON.stringify({song:name,note})});
    const data=await r.json();
    if(data&&data.ok){ localStorage.setItem(LAST_REQ_KEY+u,Date.now()); document.getElementById('reqModal').classList.remove('show'); document.getElementById('reqName').value=''; document.getElementById('reqNote').value=''; alert('求歌提交成功！'); }
    else err.textContent=(data&&data.msg)||'提交失败';
  }catch(e){ err.textContent='网络错误，请重试'; }
}

// 搜索
document.getElementById('search').addEventListener('input',e=>renderList(e.target.value));

// Media Session
function updateMediaSession(){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata=new MediaMetadata({title:SONGS[current].name,artist:'LHB 工具箱',album:'在线音乐'});
  navigator.mediaSession.setActionHandler('play',()=>audio.play());
  navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack',prev);
  navigator.mediaSession.setActionHandler('nexttrack',next);
}

// 接收收藏夹播放指令
function handleFavPlay(){
  const params=new URLSearchParams(location.search);
  if(params.get('play')!=='fav') return;
  const u=localStorage.getItem('lhb_user');
  if(!u){ alert('请先登录'); return; }
  loadFavs();
  if(!favs.length){ alert('收藏夹为空'); return; }
  // 按收藏顺序播放
  const names=favs;
  const idxs=names.map(n=>SONGS.findIndex(s=>s.name===n)).filter(i=>i>=0);
  if(!idxs.length){ alert('收藏夹为空'); return; }
  // 建立自定义播放队列
  window.__favQueue=idxs; window.__favPos=0;
  play(idxs[0]);
  // 覆盖 next/ended 逻辑
  const origNext=window.next;
  window.next=function(e){ if(e)e.stopPropagation(); if(window.__favQueue){ window.__favPos++; if(window.__favPos>=window.__favQueue.length){ window.__favPos=0; } play(window.__favQueue[window.__favPos]); } else origNext(e); };
}

// 初始化
loadFavs();
renderList();
// 预加载第一首
const pre=new Audio(); pre.preload='auto'; pre.src=SONGS[0].url;
handleFavPlay();
</script>
